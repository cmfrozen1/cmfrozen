    function App() {
      const [siteData, setSiteData] = useState(DEFAULT_DATA);
      const [loading, setLoading] = useState(true);

      // Product options state
      const [selectedSizeId, setSelectedSizeId] = useState('standard');
      const [selectedBundleId, setSelectedBundleId] = useState(1);
      const [upsellAdded, setUpsellAdded] = useState(false);
      const [quantity, setQuantity] = useState(1);

      // Gallery state
      const [activeSlide, setActiveSlide] = useState(0);
      const [selectedColors, setSelectedColors] = useState([]);

      // Hotspots state
      const [activeHotspotId, setActiveHotspotId] = useState(1);

      // Accordion open states
      const [openAccs, setOpenAccs] = useState({ 0: true });
      const [openFaqs, setOpenFaqs] = useState({ 0: true });

      // Reviews filter
      const [reviewFilter, setReviewFilter] = useState('all');

      // Cart & Checkout
      const [cartOpen, setCartOpen] = useState(false);
      const [checkoutOpen, setCheckoutOpen] = useState(false);
      const [orderForm, setOrderForm] = useState({ name: '', phone: '', address: '', payment_method: 'cod' });
      const [orderSubmitting, setOrderSubmitting] = useState(false);
      const [orderResult, setOrderResult] = useState(null);
      const [slipUploading, setSlipUploading] = useState(false);
      const [slipUploadMessage, setSlipUploadMessage] = useState('');
      const [trackingOpen, setTrackingOpen] = useState(false);
      const [trackingPhone, setTrackingPhone] = useState('');
      const [trackingLoading, setTrackingLoading] = useState(false);
      const [trackingOrders, setTrackingOrders] = useState([]);
      const [trackingMessage, setTrackingMessage] = useState('');

      // Sticky Bar
      const [stickyVisible, setStickyVisible] = useState(false);

      // Timer
      const [timeLeft, setTimeLeft] = useState(31335);

      // Fetch dynamic content from API
      useEffect(() => {
        fetch('api.php?action=get_content')
          .then(res => res.json())
          .then(res => {
            if (res.success && res.data) {
              setSiteData(prev => ({
                ...prev,
                ...res.data
              }));
            }
          })
          .catch(err => {
            console.log('Using default dataset fallback:', err);
          })
          .finally(() => setLoading(false));
      }, []);

      
      // Update SEO Meta Tags
      useEffect(() => {
        if (siteData.seo) {
          if (siteData.seo.title) document.title = siteData.seo.title;
          
          let metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc && siteData.seo.description) {
            metaDesc.setAttribute("content", siteData.seo.description);
          }
          
          let metaKeywords = document.querySelector('meta[name="keywords"]');
          if (!metaKeywords && siteData.seo.keywords) {
            metaKeywords = document.createElement('meta');
            metaKeywords.name = "keywords";
            document.head.appendChild(metaKeywords);
          }
          if (metaKeywords && siteData.seo.keywords) {
            metaKeywords.setAttribute("content", siteData.seo.keywords);
          }

          // OG Tags
          if (siteData.seo.og_image) {
            let ogImg = document.querySelector('meta[property="og:image"]');
            if (!ogImg) {
              ogImg = document.createElement('meta');
              ogImg.setAttribute('property', 'og:image');
              document.head.appendChild(ogImg);
            }
            ogImg.setAttribute('content', siteData.seo.og_image);
          }
          if (siteData.seo.description) {
            let ogDesc = document.querySelector('meta[property="og:description"]');
            if (!ogDesc) {
              ogDesc = document.createElement('meta');
              ogDesc.setAttribute('property', 'og:description');
              document.head.appendChild(ogDesc);
            }
            ogDesc.setAttribute('content', siteData.seo.description);
          }
        }
      }, [siteData.seo]);

      // Sync countdown timer with admin-configured duration (top_bar.timer_seconds)
      useEffect(() => {
        const t = parseInt(siteData.top_bar?.timer_seconds, 10);
        if (!isNaN(t) && t > 0) {
          setTimeLeft(t);
        }
      }, [siteData.top_bar?.timer_seconds]);

      // Scroll listener for sticky bar
      useEffect(() => {
        const handleScroll = () => {
          const hero = document.getElementById('product');
          if (hero) {
            const rect = hero.getBoundingClientRect();
            setStickyVisible(rect.bottom < 150);
          }
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Countdown interval (resets to admin-configured duration when it hits zero)
      useEffect(() => {
        const interval = setInterval(() => {
          setTimeLeft(prev => (prev > 0 ? prev - 1 : 31335));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      // Price calculation
      const sizes = (siteData.product?.sizes && siteData.product.sizes.length > 0) ? siteData.product.sizes : DEFAULT_DATA.product.sizes;
      const currentSize = sizes.find(s => s.id === selectedSizeId) || sizes[0] || DEFAULT_DATA.product.sizes[0];
      const bundles = (siteData.product?.bundles && siteData.product.bundles.length > 0) ? siteData.product.bundles : DEFAULT_DATA.product.bundles;
      const currentBundle = bundles.find(b => b.id === selectedBundleId) || bundles[0] || DEFAULT_DATA.product.bundles[0];
      const upsellPrice = siteData.product?.upsell?.price || 790;
      const colorOptions = (siteData.product?.color_options && siteData.product.color_options.length > 0)
        ? siteData.product.color_options
        : DEFAULT_DATA.product_defaults.color_options;
      const paymentSettings = siteData.payment_settings || {};
      // Older saved settings may only have a PromptPay number. Treat that as
      // enabled so customers can still select it, while respecting an explicit off.
      const promptpayEnabled = paymentSettings.promptpay_enabled === true ||
        paymentSettings.promptpay_enabled === 1 ||
        paymentSettings.promptpay_enabled === '1' ||
        (paymentSettings.promptpay_enabled !== false && Boolean(String(paymentSettings.promptpay_number || '').trim()));
      // `actual_items` covers promotions such as "buy 3, get 1"; use the
      // bundle multiplier for regular bundles and fall back to one item.
      const itemsPerBundle = Math.max(1, Number(currentBundle?.actual_items ?? currentBundle?.multiplier ?? 1));
      const selectedItemCount = itemsPerBundle * quantity;
      const needsColorSelection = selectedItemCount >= 2 && colorOptions.length > 0;
      const colorsSelectedForEveryItem = !needsColorSelection || (
        selectedColors.length === selectedItemCount && selectedColors.every(Boolean)
      );
      const selectedColorsLabel = selectedColors
        .map((color, index) => color ? `ชิ้นที่ ${index + 1}: ${color}` : null)
        .filter(Boolean)
        .join(', ');

      // Keep one color slot per physical item when the package or quantity changes.
      useEffect(() => {
        setSelectedColors(previous => Array.from({ length: needsColorSelection ? selectedItemCount : 0 }, (_, index) => {
          const color = previous[index] || '';
          return colorOptions.some(option => option.name === color) ? color : '';
        }));
      }, [needsColorSelection, selectedItemCount, colorOptions.map(option => option.name).join('|')]);

      let calculatedTotal = 0;
      let calculatedCompare = 0;

      const sizePrice = currentSize?.price || 2690;
      const sizeComparePrice = currentSize?.compare_price || 4400;

      if (currentBundle?.id === 1) {
        calculatedTotal = sizePrice * quantity;
        calculatedCompare = sizeComparePrice * quantity;
      } else if (currentBundle?.id === 2) {
        calculatedTotal = Math.round(sizePrice * 2 * 0.9) * quantity;
        calculatedCompare = (sizeComparePrice * 2) * quantity;
      } else if (currentBundle?.id === 4) {
        calculatedTotal = (sizePrice * 3) * quantity;
        calculatedCompare = (sizeComparePrice * 4) * quantity;
      } else {
        calculatedTotal = sizePrice * quantity;
        calculatedCompare = sizeComparePrice * quantity;
      }

      if (upsellAdded) {
        calculatedTotal += upsellPrice * quantity;
        calculatedCompare += (siteData.product?.upsell?.compare_price || 1290) * quantity;
      }

      const savings = calculatedCompare - calculatedTotal;

      // Format Timer
      const h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
      const m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');

      // Gallery images
      const gallery = (siteData.product?.gallery && siteData.product.gallery.length > 0) ? siteData.product.gallery : DEFAULT_DATA.product.gallery;
      const currentImg = gallery[activeSlide] || gallery[0] || DEFAULT_DATA.product.gallery[0];

      // Handle Submit Order
      const handleOrderSubmit = (e) => {
        e.preventDefault();
        if (!colorsSelectedForEveryItem) {
          Swal.fire({
            icon: 'warning',
            title: 'เลือกสีไม่ครบ',
            text: `กรุณาเลือกสีให้ครบทั้ง ${selectedItemCount} ชิ้น`,
            confirmButtonText: 'ตกลง'
          });
          return;
        }
        setOrderSubmitting(true);
        const payload = {
          name: orderForm.name,
          phone: orderForm.phone,
          address: orderForm.address,
          payment_method: orderForm.payment_method,
          product_title: siteData.product.title,
          size_name: currentSize.title,
          bundle_name: currentBundle.name,
          quantity: quantity,
          colors: needsColorSelection ? selectedColors : [],
          upsell_included: upsellAdded,
          total_price: calculatedTotal
        };

        fetch('api.php?action=create_order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              setSlipUploadMessage('');
              setOrderResult({
                order_no: res.order_no,
                total: calculatedTotal
        });
            } else {
              Swal.fire({
                icon: 'error',
                title: 'เกิดข้อผิดพลาด',
                text: res.error || 'ไม่สามารถสั่งซื้อได้',
                confirmButtonText: 'ตกลง'
              });
            }
          })
          .catch(err => {
            Swal.fire({
              icon: 'error',
              title: 'เกิดข้อผิดพลาด',
              text: 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง',
              confirmButtonText: 'ตกลง'
            });
          })
          .finally(() => setOrderSubmitting(false));
      };

      const proceedToCheckout = () => {
        if (!colorsSelectedForEveryItem) {
          Swal.fire({
            icon: 'warning',
            title: 'เลือกสีไม่ครบ',
            text: `กรุณาเลือกสีให้ครบทั้ง ${selectedItemCount} ชิ้นก่อนสั่งซื้อ`,
            confirmButtonText: 'ตกลง'
          });
          return;
        }
        setCartOpen(false);
        setCheckoutOpen(true);
      };

      const openCart = () => {
        if (!colorsSelectedForEveryItem) {
          Swal.fire({
            icon: 'warning',
            title: 'เลือกสีไม่ครบ',
            text: `กรุณาเลือกสีให้ครบทั้ง ${selectedItemCount} ชิ้นก่อนเพิ่มลงตะกร้า`,
            confirmButtonText: 'ตกลง'
          });
          return;
        }
        setCartOpen(true);
      };

      const handleSlipUpload = (event) => {
        const file = event.target.files?.[0];
        if (!file || !orderResult?.order_no) return;
        setSlipUploading(true);
        setSlipUploadMessage('กำลังอัปโหลดสลิป...');
        const formData = new FormData();
        formData.append('order_no', orderResult.order_no);
        formData.append('slip', file);

        fetch('api.php?action=upload_slip', { method: 'POST', body: formData })
          .then(res => res.json())
          .then(res => {
            if (!res.success) throw new Error(res.error || 'ไม่สามารถอัปโหลดสลิปได้');
            setOrderResult(previous => ({ ...previous, slip_path: res.slip_path }));
            setSlipUploadMessage('แนบสลิปเรียบร้อยแล้ว เจ้าหน้าที่จะตรวจสอบการชำระเงิน');
          })
          .catch(error => setSlipUploadMessage(error.message || 'ไม่สามารถอัปโหลดสลิปได้'))
          .finally(() => setSlipUploading(false));
      };

      const getOrderStatusLabel = (status) => {
        if (status === 'confirmed') return 'ยืนยันออเดอร์แล้ว';
        if (status === 'shipping') return 'กำลังจัดส่ง';
        if (status === 'completed') return 'จัดส่งสำเร็จ';
        if (status === 'cancelled') return 'ยกเลิก';
        return 'รอดำเนินการ';
      };

      const openTrackingLookup = () => {
        setTrackingOpen(true);
        setTrackingMessage('');
        setTrackingOrders([]);
      };

      const handleTrackingLookup = (event) => {
        event.preventDefault();
        const phone = trackingPhone.trim();
        if (!phone) {
          setTrackingMessage('กรุณากรอกเบอร์โทรศัพท์ที่ใช้สั่งซื้อ');
          return;
        }

        setTrackingLoading(true);
        setTrackingMessage('');
        setTrackingOrders([]);

        fetch('api.php?action=lookup_order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        })
          .then(res => res.json())
          .then(res => {
            if (!res.success) throw new Error(res.error || 'ไม่สามารถค้นหาข้อมูลได้');
            const orders = res.orders || [];
            setTrackingOrders(orders);
            if (orders.length === 0) {
              setTrackingMessage('ไม่พบคำสั่งซื้อจากเบอร์โทรนี้');
            }
          })
          .catch(error => setTrackingMessage(error.message || 'ไม่สามารถค้นหาข้อมูลได้'))
          .finally(() => setTrackingLoading(false));
      };

      return (
        <div>
          {/* 1. TOP ANNOUNCEMENT BAR & COUNTDOWN */}
          {siteData.section_visibility?.top_bar !== false && (
          <div className="top-bar">
            <div className="top-bar-inner">
              {(siteData.top_bar?.items || []).map((item, idx) => (
                <div key={idx} className="top-bar-item">
                  <span>{item}</span>
                  {idx === ((siteData.top_bar?.items?.length || 0) - 1) && (
                    <span className="top-bar-timer">{h}:{m}:{s}</span>
                  )}
                </div>
              ))}
            </div>
          </div>
          )}

          {/* 2. NAVIGATION HEADER */}
          {siteData.section_visibility?.header !== false && (
          <header className="site-header">
            <div className="container">
              <div className="header-inner">
                <a href="#" className="header-logo">
                  <img src={siteData.header?.logo_url} alt="Fukupetstore Logo" />
                </a>
                
                <ul className="nav-links">
                  {(siteData.header?.nav_links || []).filter(nav => {
                    const sectionId = nav.href.replace("#", "");
                    if (sectionId === "product") return siteData.section_visibility?.product !== false;
                    if (sectionId === "benefits") return siteData.section_visibility?.benefits_section !== false;
                    if (sectionId === "hotspots") return siteData.section_visibility?.hotspots_section !== false;
                    if (sectionId === "comparison") return siteData.section_visibility?.comparison_section !== false;
                    if (sectionId === "reviews") return siteData.section_visibility?.reviews_section !== false;
                    if (sectionId === "faq") return siteData.section_visibility?.faq_section !== false;
                    return true;
                  }).map((nav, idx) => (
                    <li key={idx}>
                      <a href={nav.href} className={`nav-link ${idx === 0 ? 'active' : ''}`}>{nav.label}</a>
                    </li>
                  ))}
                  <li>
                    <button type="button" className="nav-link nav-button-link" onClick={openTrackingLookup}>ขอเลข Tracking</button>
                  </li>
                </ul>

                <div className="header-actions">
                  <button className="header-btn" onClick={openTrackingLookup} title="ขอเลข Tracking">
                    <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                  </button>
                  <button className="header-btn" onClick={() => setCartOpen(true)} title="ตะกร้าสินค้า">
                    <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span className="cart-badge">{(upsellAdded ? 2 : 1) * quantity}</span>
                  </button>
                </div>
              </div>
            </div>
          </header>
          )}

          {/* 3. HERO / PRODUCT SECTION */}
          {siteData.section_visibility?.product !== false && (
          <section className="product-section" id="product">
            <div className="container">
              <div className="product-grid">
                
                {/* Gallery Column (Left) */}
                <div className="gallery-container">
                  <div className="gallery-main">
                    <img src={currentImg.url} alt={currentImg.alt} />
                    <button className="gallery-nav-btn prev" onClick={() => setActiveSlide(prev => (prev > 0 ? prev - 1 : gallery.length - 1))}>‹</button>
                    <button className="gallery-nav-btn next" onClick={() => setActiveSlide(prev => (prev < gallery.length - 1 ? prev + 1 : 0))}>›</button>
                  </div>

                  {/* Thumbnails */}
                  <div className="gallery-thumbs">
                    {gallery.map((thumb, idx) => (
                      <div
                        key={idx}
                        className={`gallery-thumb ${idx === activeSlide ? 'active' : ''}`}
                        onClick={() => setActiveSlide(idx)}
                      >
                        <img src={thumb.thumb || thumb.url} alt={thumb.alt} />
                      </div>
                    ))}
                  </div>

                  {/* Trust Badges */}
                  {siteData.section_visibility?.trust_badges !== false && (
                  <div className="trust-badges-row">
                    {(siteData.product?.trust_badges || []).map((badge, idx) => (
                      <div key={idx} className="trust-badge-item">
                        <img src={badge.icon} alt="Badge" />
                        <span dangerouslySetInnerHTML={{ __html: badge.text }}></span>
                      </div>
                    ))}
                  </div>
                  )}
                </div>

                {/* Product Form Column (Right) */}
                <div className="product-info">
                  <div className="product-header-rating">
                    <span className="stars">★★★★★</span>
                    <span style={{ color: 'var(--primary-color)', fontWeight: 600 }}>{siteData.product?.rating}</span>
                    <span style={{ color: 'var(--text-muted)' }}>{siteData.product?.reviews_text}</span>
                    <span className="sold-badge">{siteData.product?.sold_text}</span>
                  </div>

                  <h1 className="product-title">{siteData.product?.title}</h1>

                  <div className="product-price-box">
                    <span className="current-price">฿{calculatedTotal.toLocaleString()}</span>
                    <span className="compare-price">฿{calculatedCompare.toLocaleString()}</span>
                    <span className="discount-tag">ประหยัด ฿{savings.toLocaleString()}</span>
                  </div>

                  <div className="urgency-pill">
                    <span className="urgency-dot"></span>
                    <span>{siteData.product?.urgency_text}</span>
                  </div>

                  {/* Size Selector */}
                  {siteData.section_visibility?.sizes !== false && (
                  <div>
                    <div className="option-group-label">เลือกขนาดหมอน:</div>
                    <div className="size-selector">
                      {sizes.map(size => (
                        <div
                          key={size.id}
                          className={`size-option ${selectedSizeId === size.id ? 'active' : ''}`}
                          onClick={() => setSelectedSizeId(size.id)}
                        >
                          <span className="size-title">{size.title}</span>
                          <span className="size-sub">{size.subtitle} (฿{size.price.toLocaleString()})</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  )}

                  {/* Deal / Bundle Selector */}
                  <div className="bundle-section">
                    <div className="bundle-header">
                      <span>🎁 โปรโมชั่นพิเศษ (ยิ่งซื้อ ยิ่งคุ้ม)</span>
                      <span style={{ color: '#059669', fontWeight: 700 }}>ส่งฟรีทุกออเดอร์</span>
                    </div>

                    {bundles.map(bundle => {
                      let bPrice = currentSize.price;
                      let bSavingsText = bundle.savings_text;
                      if (bundle.id === 2) {
                        bPrice = Math.round(currentSize.price * 2 * 0.9);
                        bSavingsText = `ประหยัดเพิ่ม ฿${(currentSize.price * 2 - bPrice).toLocaleString()}`;
                      } else if (bundle.id === 4) {
                        bPrice = currentSize.price * 3;
                        bSavingsText = `ประหยัด ฿${currentSize.price.toLocaleString()} (แถมฟรี 1 ใบ)`;
                      }

                      return (
                        <div
                          key={bundle.id}
                          className={`deal-card ${selectedBundleId === bundle.id ? 'active' : ''}`}
                          onClick={() => setSelectedBundleId(bundle.id)}
                        >
                          {bundle.badge && <span className="deal-badge">{bundle.badge}</span>}
                          <div className="deal-left">
                            <div className="deal-radio"></div>
                            <div>
                              <div className="deal-name">{bundle.name}</div>
                              <div className="deal-desc">{bundle.desc}</div>
                            </div>
                          </div>
                          <div className="deal-right">
                            <div className="deal-price">฿{bPrice.toLocaleString()}</div>
                            <div className="deal-savings">{bSavingsText}</div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Select a color for every physical item in multi-item purchases. */}
                  {needsColorSelection && (
                    <div className="bundle-section" style={{ paddingTop: 16 }}>
                      <div className="option-group-label">{siteData.product?.color_label || DEFAULT_DATA.product_defaults.color_label}</div>
                      <div style={{ marginTop: 8, display: 'grid', gap: 14 }}>
                        {Array.from({ length: selectedItemCount }, (_, itemIndex) => (
                          <div key={itemIndex} style={{ padding: '10px 0', borderBottom: itemIndex < selectedItemCount - 1 ? '1px solid #eee' : 'none' }}>
                            <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 8 }}>สินค้าชิ้นที่ {itemIndex + 1}</div>
                            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                              {colorOptions.map((col, colorIndex) => (
                                <div
                                  key={colorIndex}
                                  onClick={() => setSelectedColors(previous => {
                                    const next = [...previous];
                                    next[itemIndex] = col.name;
                                    return next;
                                  })}
                                  style={{
                                    display: 'flex', alignItems: 'center', gap: 8,
                                    padding: '8px 14px', borderRadius: 10, cursor: 'pointer',
                                    border: selectedColors[itemIndex] === col.name ? '2px solid var(--primary-color)' : '1.5px solid #ddd',
                                    background: selectedColors[itemIndex] === col.name ? 'rgba(7,47,31,0.05)' : '#fff',
                                    fontWeight: 600, fontSize: 14
                                  }}
                                >
                                  <span style={{ width: 20, height: 20, borderRadius: '50%', background: col.hex, border: '1px solid #ccc', display: 'inline-block' }}></span>
                                  {col.name}
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Upsell Checkbox */}
                  {siteData.product?.upsell?.enabled && siteData.section_visibility?.upsell !== false && (
                    <div
                      className={`upsell-box ${upsellAdded ? 'active' : ''}`}
                      onClick={() => setUpsellAdded(!upsellAdded)}
                    >
                      <input
                        type="checkbox"
                        checked={upsellAdded}
                        onChange={() => {}}
                        style={{ width: 20, height: 20, accentColor: 'var(--primary-color)' }}
                      />
                      <img className="upsell-img" src={siteData.product.upsell.image} alt="ปลอกหมอน" />
                      <div className="upsell-details">
                        <div className="upsell-title">{siteData.product.upsell.title}</div>
                        <div className="upsell-meta">{siteData.product.upsell.meta}</div>
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        <div className="upsell-price">+฿{siteData.product.upsell.price.toLocaleString()}</div>
                        <div style={{ fontSize: 11, color: '#999', textDecoration: 'line-through' }}>฿{siteData.product.upsell.compare_price.toLocaleString()}</div>
                      </div>
                    </div>
                  )}

                  {/* Action Buttons Row */}
                  <div className="cta-row">
                    <div className="qty-picker">
                      <button className="qty-btn" onClick={() => setQuantity(q => (q > 1 ? q - 1 : 1))}>−</button>
                      <div className="qty-val">{quantity}</div>
                      <button className="qty-btn" onClick={() => setQuantity(q => q + 1)}>+</button>
                    </div>
                    <button className="btn-buy-now" onClick={proceedToCheckout}>
                      <span>สั่งซื้อเลย</span>
                      <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                    <button className="btn-add-cart" onClick={openCart} title="เพิ่มลงในรถเข็น">
                      <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    </button>
                  </div>

                  <div style={{ textAlign: 'center', fontSize: 13, color: 'var(--text-muted)' }}>
                    {siteData.product?.guarantee_text}
                  </div>

                  {/* Product Accordion Tabs */}
                  <div className="product-accordions">
                    {(siteData.product?.accordions || []).map((acc, idx) => (
                      <div key={idx} className={`acc-item ${openAccs[idx] ? 'open' : ''}`}>
                        <button
                          className="acc-trigger"
                          onClick={() => setOpenAccs(prev => ({ ...prev, [idx]: !prev[idx] }))}
                        >
                          <span>{acc.title}</span>
                          <span className="acc-icon">{openAccs[idx] ? '−' : '+'}</span>
                        </button>
                        <div className="acc-content" dangerouslySetInnerHTML={{ __html: acc.content }}></div>
                      </div>
                    ))}
                  </div>

                </div>

              </div>
            </div>
          </section>
          )}

          {/* 4. FEATURE ROW (4 ICONS) */}
          {siteData.section_visibility?.features !== false && (
          <section className="features-row-sec">
            <div className="container">
              <div className="features-grid">
                {(siteData.features || []).map((f, idx) => (
                  <div key={idx} className="feature-card">
                    <div className="feature-card-icon">
                      <img src={f.icon} alt={f.title} />
                    </div>
                    <div className="feature-card-title">{f.title}</div>
                  </div>
                ))}
              </div>
            </div>
          </section>
          )}

          {/* 5. BENEFIT CARDS */}
          {siteData.section_visibility?.benefits_section !== false && (
          <section className="benefits-sec" id="benefits">
            <div className="container">
              <div className="section-head">
                <h2 className="section-title">{siteData.benefits_section?.title}</h2>
                <p className="section-subtitle">{siteData.benefits_section?.subtitle}</p>
              </div>

              <div className="benefits-grid">
                {(siteData.benefits_section?.cards || []).map((card, idx) => (
                  <div key={idx} className="benefit-card">
                    <div className="benefit-img">
                      <img src={card.image} alt={card.title} />
                    </div>
                    <h3 className="benefit-title">{card.title}</h3>
                    <p className="benefit-text">{card.text}</p>
                    <ul className="benefit-bullets">
                      {(card.bullets || []).map((b, bIdx) => (
                        <li key={bIdx}>{b}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>

              <div className="benefits-cta-wrap">
                <a href={siteData.benefits_section?.cta_link || '#product'} className="btn-section-cta">
                  {siteData.benefits_section?.cta_text}
                </a>
                <div className="benefits-guarantee">{siteData.benefits_section?.guarantee}</div>
              </div>
            </div>
          </section>
          )}

          {/* 6. FUNCTION HOTSPOTS / 3D ANATOMY */}
          {siteData.section_visibility?.hotspots_section !== false && (
          <section className="hotspots-sec" id="hotspots">
            <div className="container">
              <div className="section-head">
                <h2 className="section-title">{siteData.hotspots_section?.title}</h2>
                <p className="section-subtitle">{siteData.hotspots_section?.subtitle}</p>
              </div>

              <div className="hotspots-grid">
                <div className="hotspots-figure-wrap">
                  <img src={siteData.hotspots_section?.image} alt="โครงสร้าง 3 มิติ หมอนโคซี่" />
                  
                  {(siteData.hotspots_section?.pins || []).map(pin => (
                    <button
                      key={pin.id}
                      className={`hotspot-pin ${activeHotspotId === pin.id ? 'active' : ''}`}
                      style={{ top: pin.top, left: pin.left }}
                      title={pin.pin_title}
                      onClick={() => setActiveHotspotId(pin.id)}
                    >
                      {pin.id}
                    </button>
                  ))}
                </div>

                <div className="hotspots-list">
                  {(siteData.hotspots_section?.pins || []).map(pin => (
                    <div
                      key={pin.id}
                      className={`hotspot-card ${activeHotspotId === pin.id ? 'open' : ''}`}
                    >
                      <div className="hotspot-card-header" onClick={() => setActiveHotspotId(pin.id)}>
                        <span className="hotspot-card-title">{pin.title}</span>
                        <span className="hotspot-card-badge">{activeHotspotId === pin.id ? '−' : '+'}</span>
                      </div>
                      <div className="hotspot-card-body">
                        <div>
                          <div className="hotspot-prop-label">คุณสมบัติ:</div>
                          <div className="hotspot-prop-desc">{pin.feature}</div>
                        </div>
                        <div>
                          <div className="hotspot-prop-label">ประโยชน์:</div>
                          <div className="hotspot-prop-desc">{pin.benefit}</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </section>
          )}

          {/* 7. COMPARISON TABLE */}
          {siteData.section_visibility?.comparison_section !== false && (
          <section className="comparison-sec" id="comparison">
            <div className="container">
              <div className="section-head">
                <h2 className="section-title">{siteData.comparison_section?.title}</h2>
                <p className="section-subtitle">{siteData.comparison_section?.subtitle}</p>
              </div>

              <div className="comparison-table-wrap">
                <table className="comparison-table">
                  <thead>
                    <tr>
                      <th>คุณสมบัติ</th>
                      <th>
                        <div className="comp-pillow-header">
                          <img className="comp-pillow-img" src={siteData.comparison_section?.chowa_img} alt={siteData.comparison_section?.chowa_name} />
                          <span className="comp-pillow-name">{siteData.comparison_section?.chowa_name}</span>
                        </div>
                      </th>

                    <div className="tracking-card" key={order.order_no}>
                      <div className="tracking-card-head">
                        <strong>{order.order_no}</strong>
                        <span className={`tracking-status tracking-status-${order.status || 'pending'}`}>
                          {getOrderStatusLabel(order.status)}
                        </span>
                      </div>
                      <div className="tracking-row">
                        <span>วันที่สั่งซื้อ</span>
                        <strong>{order.created_at || '-'}</strong>
                      </div>
                      <div className="tracking-row">
                        <span>สินค้า</span>
                        <strong>{order.product_title} {order.size_name ? `(${order.size_name})` : ''}</strong>
                      </div>
                      <div className="tracking-row">
                        <span>แพ็กเกจ</span>
                        <strong>{order.bundle_name || '-'} x{order.quantity || 1}</strong>
                      </div>
                      <div className="tracking-row">
                        <span>ยอดรวม</span>
                        <strong>฿{Number(order.total_price || 0).toLocaleString()}</strong>
                      </div>
                      {order.status === 'shipping' ? (
                        <div className="tracking-number-box">
                          <span>เลข Tracking</span>
                          <strong>{order.tracking_number || 'กำลังอัปเดตเลข Tracking'}</strong>
                          {order.shipping_carrier && (
                            <div style={{ marginTop: 6, fontSize: 13 }}>
                              ขนส่งโดย: <strong>{order.shipping_carrier}</strong>
                            </div>
                          )}
                        </div>
                      ) : (
                        <div className="tracking-note">เลข Tracking จะแสดงเมื่อสถานะเป็น “กำลังจัดส่ง”</div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          {/* 14. FUKUPETSTORE CLUB & FOOTER */}
          {siteData.section_visibility?.club_section !== false && (<section className="chowa-club-sec">
            <div className="chowa-club-inner">
              <h3 className="club-title">{siteData.footer?.club_title}</h3>
              <p className="club-desc">{siteData.footer?.club_desc}</p>
              <form
                className="club-form"
                onSubmit={(e) => {
                  e.preventDefault();
                  Swal.fire({
                    icon: 'success',
                    title: 'สมัครสมาชิกสำเร็จ',
                    text: 'ขอบคุณที่สมัครสมาชิก Fukupetstore Club! เราได้ส่งโค้ดส่วนลดไปยังอีเมลของคุณแล้ว',
                    confirmButtonText: 'ตกลง',
                    confirmButtonColor: 'var(--primary-color)'
                  });
                }}
              >
                <input type="email" className="club-input" placeholder="กรอกอีเมลของคุณ..." required />
                <button type="submit" className="club-btn">รับส่วนลด</button>
              </form>
            </div>
          </section>
          )}

          {siteData.section_visibility?.footer !== false && (
          <footer className="site-footer">
            <div className="container">
              <div className="footer-grid">
                {siteData.section_visibility?.footer_about !== false && (<div className="footer-about">
                  <img src={siteData.header?.logo_url} alt="Fukupetstore Logo" />
                  <p>{siteData.footer?.about}</p>
                </div>)}

                {siteData.section_visibility?.footer_products !== false && (<div className="footer-col">
                  <h4>{siteData.footer?.products_title || 'สินค้าของเรา'}</h4>
                  <ul>
                    {(siteData.footer?.products || []).map((p, idx) => (
                      <li key={idx}><a href={p.href}>{p.label}</a></li>
                    ))}
                  </ul>
                </div>)}

                {siteData.section_visibility?.footer_services !== false && (<div className="footer-col">
                  <h4>{siteData.footer?.services_title || 'การบริการและช่วยเหลือ'}</h4>
                  <ul>
                    {(siteData.footer?.services || []).map((s, idx) => (
                      <li key={idx}><a href={s.href}>{s.label}</a></li>
                    ))}
                  </ul>
                </div>)}

                {siteData.section_visibility?.footer_contact !== false && (<div className="footer-col">
                  <h4>{siteData.footer?.contact_title || 'ติดต่อเรา'}</h4>
                  <ul>
                    {(siteData.footer?.contact || []).map((c, idx) => (
                      <li key={idx}><a href={c.href}>{c.label}</a></li>
                    ))}
                  </ul>
                </div>)}
              </div>

              {siteData.section_visibility?.footer_bottom !== false && (<div className="footer-bottom">
                <div>{siteData.footer?.copyright}</div>
                <div>{siteData.footer?.payments}</div>
              </div>)}
            </div>
          </footer>
          )}

        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Component Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 40, textAlign: 'center', fontFamily: 'Prompt, sans-serif' }}>
              <h2>เกิดข้อผิดพลาดในการโหลดหน้าเว็บ</h2>
              <p style={{ color: '#666', marginTop: 8 }}>{this.state.error?.toString()}</p>
              <button onClick={() => window.location.reload()} style={{ padding: '10px 24px', background: '#072F1F', color: '#fff', border: 'none', borderRadius: 8, cursor: 'pointer', marginTop: 16, fontSize: 16 }}>
                รีโหลดหน้าเว็บ
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
