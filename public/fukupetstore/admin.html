<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fukupet Admin CMS – Fukupet Store Management</title>
  <link rel="shortcut icon" href="https://www.chowa.in.th/cdn/shop/files/Favicon_chowa_new_f8d6d5a3-43e0-4c92-a69e-f581dd6fb9d9_32x32.png?v=1643772777" type="image/png">
  
  <!-- Google Fonts: Plus Jakarta Sans & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* ---------------------------------------------------------------------
       fukupet Admin - Premium Design System & Theme Variables
    --------------------------------------------------------------------- */
    :root {
      --brand-forest-dark: #051C12;     /* Sidebar & Header Dark BG */
      --brand-forest-medium: #072F1F;   /* Primary Dark Forest Accent */
      --brand-forest-light: #1A3E30;    /* Card & Hover Tints */
      --brand-lime: #B4F105;            /* Highlight Lime Yellow */
      --brand-lime-hover: #c1f824;      
      --brand-lime-translucent: rgba(180, 241, 5, 0.15);

      --bs-body-bg: #F4F6F5;            /* Canvas background */
      --text-main: #0B130F;             /* Primary text */
      --text-muted-green: #6C7E75;      /* Secondary text */
      --text-sidebar-muted: #879A91;    /* Sidebar inactive link labels */

      --card-background: #FFFFFF;
      --border-light: #E9EFEF;
      --border-dark-green: rgba(255, 255, 255, 0.1);

      --sidebar-width: 270px;
      --sidebar-minimized-width: 80px;

      --radius-xxl: 24px;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;

      --shadow-sm: 0 2px 8px rgba(11, 19, 15, 0.02);
      --shadow-md: 0 10px 30px rgba(11, 19, 15, 0.04);
      --shadow-lg: 0 20px 50px rgba(11, 19, 15, 0.08);

      --font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-family) !important;
    }

    body {
      background-color: var(--bs-body-bg);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      font-size: 0.925rem;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

    /* ---------------------------------------------------------------------
       Sidebar Layout (.sidebar-wrapper)
    --------------------------------------------------------------------- */
    .sidebar-wrapper {
      width: var(--sidebar-width);
      background-color: var(--brand-forest-dark);
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1030;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      border-right: 1px solid var(--border-dark-green);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 1.5rem;
      padding-left: 0.5rem;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .sidebar-brand i {
      color: var(--brand-lime);
      font-size: 1.6rem;
      transition: transform 0.3s ease;
    }

    .sidebar-brand:hover i {
      transform: scale(1.15) rotate(90deg);
    }

    .sidebar-brand span {
      background: linear-gradient(135deg, #FFFFFF 60%, var(--brand-lime) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-menu-section {
      margin-bottom: 1.25rem;
    }

    .sidebar-menu-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-sidebar-muted);
      padding-left: 0.75rem;
      margin-bottom: 0.5rem;
      opacity: 0.7;
    }

    .sidebar-menu-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar-menu-item {
      margin-bottom: 0.25rem;
    }

    .sidebar-menu-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      color: var(--text-sidebar-muted);
      border-radius: var(--radius-md);
      font-weight: 600;
      transition: all 0.2s ease-in-out;
      position: relative;
      cursor: pointer;
      text-decoration: none;
    }

    .sidebar-menu-link i {
      font-size: 1.1rem;
      transition: color 0.2s ease;
    }

    .sidebar-menu-link:hover {
      color: #FFFFFF;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .sidebar-menu-link.active {
      color: #FFFFFF;
      background-color: rgba(255, 255, 255, 0.08);
      font-weight: 700;
    }

    .sidebar-menu-link.active::before {
      content: '';
      position: absolute;
      left: -1rem;
      top: 15%;
      height: 70%;
      width: 4px;
      background-color: var(--brand-lime);
      border-radius: 0 4px 4px 0;
      box-shadow: 0 0 10px var(--brand-lime);
    }

    .sidebar-menu-link.active i {
      color: var(--brand-lime);
    }

    .sidebar-badge {
      margin-left: auto;
      font-size: 0.7rem;
      font-weight: 800;
      background-color: var(--brand-lime);
      color: var(--brand-forest-dark);
      padding: 0.15rem 0.5rem;
      border-radius: 50rem;
    }

    .sidebar-visibility-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: auto;
    }
    .sidebar-visibility-dot.visible { background-color: var(--brand-lime); box-shadow: 0 0 6px var(--brand-lime); }
    .sidebar-visibility-dot.hidden { background-color: #64748B; opacity: 0.5; }

    /* Sidebar Bottom Profile */
    .sidebar-profile {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: rgba(255, 255, 255, 0.04);
      padding: 0.75rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-dark-green);
      color: #FFFFFF;
    }

    .sidebar-profile-avatar {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-lg);
      background-color: var(--brand-forest-medium);
      color: var(--brand-lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid var(--border-dark-green);
    }

    .sidebar-profile-info {
      flex-grow: 1;
      min-width: 0;
    }

    .sidebar-profile-name {
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #FFFFFF;
    }

    .sidebar-profile-role {
      font-size: 0.7rem;
      color: var(--brand-lime);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Minimized Sidebar */
    body.sidebar-minimized .sidebar-wrapper {
      width: var(--sidebar-minimized-width);
      padding: 1.5rem 0.5rem;
      align-items: center;
    }

    body.sidebar-minimized .sidebar-brand span,
    body.sidebar-minimized .sidebar-menu-title,
    body.sidebar-minimized .sidebar-menu-link span,
    body.sidebar-minimized .sidebar-badge,
    body.sidebar-minimized .sidebar-visibility-dot,
    body.sidebar-minimized .sidebar-profile-info {
      display: none !important;
    }

    body.sidebar-minimized .sidebar-brand {
      padding-left: 0;
      justify-content: center;
    }

    body.sidebar-minimized .sidebar-menu-link {
      justify-content: center;
      padding: 0.65rem;
    }

    body.sidebar-minimized .sidebar-menu-link.active::before {
      left: -0.5rem;
    }

    body.sidebar-minimized .sidebar-profile {
      padding: 0.35rem;
      justify-content: center;
      border: none;
      background: transparent;
    }

    body.sidebar-minimized .main-wrapper {
      margin-left: var(--sidebar-minimized-width);
    }

    /* ---------------------------------------------------------------------
       Main Content Wrapper Layout
    --------------------------------------------------------------------- */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      padding: 1.5rem 2rem;
      min-height: 100vh;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    /* Top Header Navbar */
    .navbar-fukupet {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(244, 246, 245, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      margin-top: -1.5rem;
      margin-left: -2rem;
      margin-right: -2rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1.25rem;
    }

    .navbar-fukupet-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .btn-toggle-sidebar {
      background: var(--card-background);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--brand-forest-medium);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }

    .btn-toggle-sidebar:hover {
      background: var(--brand-forest-medium);
      color: #FFFFFF;
    }

    .navbar-fukupet-right {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    /* DB Badges */
    .fukupet-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      border-radius: 50rem;
      font-size: 0.825rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }
    .fukupet-badge-connected {
      background: #DCFCE7;
      color: #15803D;
      border: 1px solid #86EFAC;
    }
    .fukupet-badge-local {
      background: #FEF3C7;
      color: #B45309;
      border: 1px solid #FDE68A;
    }
    .fukupet-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .fukupet-badge-connected .fukupet-badge-dot { background-color: #22C55E; box-shadow: 0 0 8px #22C55E; }
    .fukupet-badge-local .fukupet-badge-dot { background-color: #F59E0B; box-shadow: 0 0 8px #F59E0B; }

    /* Action Buttons */
    .btn-fukupet-primary {
      background-color: var(--brand-forest-medium);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-lg);
      padding: 0.55rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease-in-out;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-fukupet-primary:hover {
      background-color: var(--brand-forest-dark);
      color: var(--brand-lime);
      box-shadow: 0 4px 14px var(--brand-lime-translucent);
    }

    .btn-fukupet-lime {
      background-color: var(--brand-lime);
      color: var(--brand-forest-dark);
      border: none;
      border-radius: var(--radius-lg);
      padding: 0.55rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px var(--brand-lime-translucent);
      transition: all 0.25s ease-in-out;
      cursor: pointer;
    }

    .btn-fukupet-lime:hover {
      background-color: var(--brand-lime-hover);
      transform: translateY(-1px);
    }

    .btn-fukupet-outline {
      background-color: #FFFFFF;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 0.55rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease-in-out;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-fukupet-outline:hover {
      background-color: #F8FAFC;
      border-color: #CBD5E1;
      color: var(--brand-forest-medium);
    }

    /* ---------------------------------------------------------------------
       fukupet Admin Cards & Page Header
    --------------------------------------------------------------------- */
    .fukupet-card {
      background: var(--card-background);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-light);
      padding: 1.75rem;
      margin-bottom: 1.75rem;
      box-shadow: var(--shadow-md);
      transition: all 0.25s ease;
    }

    .fukupet-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.15rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-light);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .fukupet-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--brand-forest-medium);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0;
    }

    .fukupet-card-title i {
      color: var(--brand-forest-medium);
      font-size: 1.3rem;
    }

    /* Stat KPI Widget Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .kpi-card {
      background: var(--card-background);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-light);
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background-color: var(--brand-forest-medium);
    }

    .kpi-card.kpi-lime::before { background-color: var(--brand-lime); }
    .kpi-card.kpi-emerald::before { background-color: var(--sys-green); }
    .kpi-card.kpi-orange::before { background-color: var(--sys-orange); }

    .kpi-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      background: #F4F6F5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--brand-forest-medium);
      flex-shrink: 0;
    }

    .kpi-icon.icon-lime { background: rgba(180, 241, 5, 0.2); color: #051C12; }
    .kpi-icon.icon-emerald { background: var(--sys-green-bg); color: var(--sys-green); }
    .kpi-icon.icon-orange { background: var(--sys-orange-bg); color: var(--sys-orange); }

    .kpi-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted-green);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kpi-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 0.15rem;
      line-height: 1.2;
    }

    /* Form Controls */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--brand-forest-medium);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 0.65rem 0.95rem;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 0.925rem;
      outline: none;
      transition: all 0.2s ease-in-out;
      background: #FFFFFF;
      color: var(--text-main);
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--brand-forest-medium);
      box-shadow: 0 0 0 3px rgba(7, 47, 31, 0.12);
    }

    .form-textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* Reusable fukupet Table */
    .fukupet-table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-light);
    }

    .fukupet-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
      background: #FFFFFF;
    }

    .fukupet-table th {
      background: #F8FAFC;
      padding: 0.95rem 1.15rem;
      font-weight: 700;
      color: var(--brand-forest-medium);
      border-bottom: 1px solid var(--border-light);
      text-transform: uppercase;
      font-size: 0.775rem;
      letter-spacing: 0.05em;
    }

    .fukupet-table td {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-main);
      vertical-align: middle;
    }

    .fukupet-table tbody tr:hover {
      background-color: #F8FAFC;
    }

    /* Status Badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.75rem;
      border-radius: 50rem;
      font-size: 0.775rem;
      font-weight: 700;
    }

    .status-pending { background: var(--sys-orange-bg); color: #C2410C; }
    .status-confirmed { background: #E0E7FF; color: #3730A3; }
    .status-shipping { background: #DBEAFE; color: #1E40AF; }
    .status-completed { background: var(--sys-green-bg); color: #15803D; }
    .status-cancelled { background: var(--sys-red-bg); color: #B91C1C; }

    /* Media Dropzone & Cards */
    .upload-dropzone {
      border: 2px dashed #CBD5E1;
      border-radius: var(--radius-xl);
      padding: 2.5rem 1.5rem;
      text-align: center;
      background: #F8FAFC;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-dropzone:hover {
      border-color: var(--brand-forest-medium);
      background: rgba(180, 241, 5, 0.05);
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .media-card {
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #FFFFFF;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .media-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .media-img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      background: #F1F5F9;
    }

    .media-info {
      padding: 0.85rem;
    }

    .media-name {
      font-weight: 700;
      color: var(--brand-forest-medium);
      font-size: 0.825rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .image-preview-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: #F8FAFC;
    }

    .image-preview-wrap {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-top: 0.5rem;
    }

    .hidden-file-input { display: none; }

    /* Toast Notification */
    .toast-fukupet {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--brand-forest-dark);
      color: #FFFFFF;
      padding: 0.95rem 1.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      font-size: 0.9rem;
      font-weight: 700;
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border: 1px solid var(--brand-lime);
      animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .toast-fukupet i { color: var(--brand-lime); font-size: 1.2rem; }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Login Screen - fukupet Dark Forest Style */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #072F1F 0%, #051C12 60%, #020B07 100%);
      padding: 1.5rem;
      position: relative;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: var(--radius-xxl);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .login-brand-icon {
      width: 68px;
      height: 68px;
      border-radius: var(--radius-xl);
      background: var(--brand-forest-dark);
      color: var(--brand-lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 1.25rem auto;
      box-shadow: 0 10px 25px var(--brand-lime-translucent);
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--brand-forest-dark);
      margin-bottom: 0.35rem;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted-green);
      margin-bottom: 1.75rem;
    }

    .login-error-box {
      background: var(--sys-red-bg);
      border: 1px solid #FCA5A5;
      color: #991B1B;
      font-size: 0.85rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.25rem;
      text-align: left;
      font-weight: 600;
    }

    .login-card .form-group {
      text-align: left;
      margin-bottom: 1.15rem;
    }

    .login-btn {
      width: 100%;
      justify-content: center;
      padding: 0.85rem;
      font-size: 1rem;
      margin-top: 0.75rem;
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body>
  <div id="admin-root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const CONTENT_SECTIONS = [
      { id: 'topbar', label: '1. แถบประกาศบนสุด', icon: 'bi-megaphone', visibilityKey: 'top_bar' },
      { id: 'header', label: '2. โลโก้ & เมนูนำทาง', icon: 'bi-layout-header', visibilityKey: 'header' },
      { id: 'product', label: '3. ข้อมูลสินค้า & ราคา', icon: 'bi-tag', visibilityKey: 'product' },
      { id: 'gallery', label: '4. แกลเลอรีรูปภาพ', icon: 'bi-images', visibilityKey: 'gallery' },
      { id: 'sizes', label: '5. ขนาดหมอน', icon: 'bi-aspect-ratio', visibilityKey: 'sizes' },
      { id: 'bundles', label: '6. โปรโมชั่นเซ็ต', icon: 'bi-box', visibilityKey: 'bundles' },
      { id: 'colors', label: '6.5 ตัวเลือกสี', icon: 'bi-palette', visibilityKey: 'product' },
      { id: 'upsell', label: '7. สินค้าซื้อเพิ่ม (Upsell)', icon: 'bi-plus-circle', visibilityKey: 'upsell' },
      { id: 'accordions', label: '8. แท็บรายละเอียดสินค้า', icon: 'bi-card-text', visibilityKey: 'accordions' },
      { id: 'features', label: '9. จุดเด่น 4 ไอคอน', icon: 'bi-stars', visibilityKey: 'features' },
      { id: 'benefits', label: '10. การ์ดคุณประโยชน์', icon: 'bi-shield-check', visibilityKey: 'benefits_section' },
      { id: 'hotspots', label: '11. โครงสร้าง 3D Hotspots', icon: 'bi-layers-half', visibilityKey: 'hotspots_section' },
      { id: 'comparison', label: '12. ตารางเปรียบเทียบ', icon: 'bi-table', visibilityKey: 'comparison_section' },
      { id: 'reviews', label: '13. รีวิวจากลูกค้าจริง', icon: 'bi-star', visibilityKey: 'reviews_section' },
      { id: 'faq', label: '14. คำถามที่พบบ่อย (FAQ)', icon: 'bi-question-circle', visibilityKey: 'faq_section' },
      { id: 'club_section', label: '14.5 เข้าร่วม Fukupetstore Club', icon: 'bi-envelope-heart', visibilityKey: 'club_section' },
      { id: 'footer', label: '15. ส่วนท้าย & ข้อมูลติดต่อ', icon: 'bi-body-text', visibilityKey: 'footer' }
    ];

    function AdminApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [activeContentSubTab, setActiveContentSubTab] = useState('topbar');
      const [isMinimized, setIsMinimized] = useState(false);

      const [siteData, setSiteData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [dbStatus, setDbStatus] = useState(null);
      const [toast, setToast] = useState(null);
      const [orders, setOrders] = useState([]);
      const [mediaImages, setMediaImages] = useState([]);
      const [uploading, setUploading] = useState(false);
      const [authState, setAuthState] = useState({ checked: false, loggedIn: false, username: null, is_superadmin: false });
      const [adminUsers, setAdminUsers] = useState([]);
      const [newUser, setNewUser] = useState({ username: '', password: '', display_name: '' });
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [loginSubmitting, setLoginSubmitting] = useState(false);

      // Effect: add/remove body class for minimized sidebar
      useEffect(() => {
        if (isMinimized) {
          document.body.classList.add('sidebar-minimized');
        } else {
          document.body.classList.remove('sidebar-minimized');
        }
      }, [isMinimized]);

      // Check existing admin session
      useEffect(() => {
        fetch('api.php?action=check_auth', { credentials: 'same-origin' })
          .then(res => res.json())
          .then(res => setAuthState({ checked: true, loggedIn: !!res.logged_in, username: res.username || null, is_superadmin: !!res.is_superadmin }))
          .catch(() => setAuthState({ checked: true, loggedIn: false, username: null, is_superadmin: false }));
      }, []);

      const authFetch = (url, options = {}) => {
        return fetch(url, { ...options, credentials: 'same-origin' }).then(res => {
          if (res.status === 401) {
            setAuthState(prev => ({ ...prev, loggedIn: false }));
            throw new Error('unauthorized');
          }
          return res;
        });
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginSubmitting(true);
        fetch('api.php?action=login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(loginForm)
        })
          .then(res => res.json().then(data => ({ ok: res.ok, data })))
          .then(({ ok, data }) => {
            if (ok && data.success) {
              setAuthState({ checked: true, loggedIn: true, username: data.username, is_superadmin: !!data.is_superadmin });
              loadData();
              loadOrders();
              loadMedia();
            } else {
              setLoginError(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
            }
          })
          .catch(() => setLoginError('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้'))
          .finally(() => setLoginSubmitting(false));
      };

      const handleLogout = () => {
        fetch('api.php?action=logout', { method: 'POST', credentials: 'same-origin' })
          .catch(() => {})
          .finally(() => {
            setAuthState({ checked: true, loggedIn: false, username: null });
            setLoginForm({ username: '', password: '' });
            setSiteData(null);
            setOrders([]);
            setMediaImages([]);
          });
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const loadData = () => {
        authFetch('api.php?action=get_content')
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              setSiteData(res.data);
              setDbStatus(res.db_status);
            }
          })
          .catch(() => showToast('เกิดข้อผิดพลาดในการโหลดข้อมูล'))
          .finally(() => setLoading(false));
      };

      const loadOrders = () => {
        authFetch('api.php?action=get_orders')
          .then(res => res.json())
          .then(res => {
            if (res.success) setOrders(res.orders || []);
          })
          .catch(() => {});
      };

      const loadMedia = () => {
        authFetch('api.php?action=list_images')
          .then(res => res.json())
          .then(res => {
            if (res.success) setMediaImages(res.images || []);
          })
          .catch(() => {});
      };

      const loadAdminUsers = () => {
        if (!authState.is_superadmin) return;
        authFetch('api.php?action=get_admin_users')
          .then(res => res.json())
          .then(res => {
            if (res.success) setAdminUsers(res.data || []);
          })
          .catch(() => {});
      };

      useEffect(() => {
        if (activeTab === 'permissions') {
          loadAdminUsers();
        }
      }, [activeTab, authState.is_superadmin]);

      const handleCreateUser = (e) => {
        e.preventDefault();
        authFetch('api.php?action=create_admin_user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newUser)
        }).then(res => res.json()).then(res => {
          if (res.success) {
            setNewUser({ username: '', password: '', display_name: '' });
            loadAdminUsers();
            setToast('สร้างผู้ใช้งานสำเร็จ');
            setTimeout(() => setToast(null), 3000);
          } else {
            alert('Error: ' + res.error);
          }
        });
      };

      const handleDeleteUser = (id) => {
        if (!confirm('ยืนยันการลบผู้ใช้งานนี้?')) return;
        authFetch('api.php?action=delete_admin_user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        }).then(res => res.json()).then(res => {
          if (res.success) {
            loadAdminUsers();
            setToast('ลบผู้ใช้งานสำเร็จ');
            setTimeout(() => setToast(null), 3000);
          } else {
            alert('Error: ' + res.error);
          }
        });
      };

      useEffect(() => {
        loadData();
        loadOrders();
        loadMedia();
      }, []);

      const toggleSectionVisibility = (visKey) => {
        const currentVis = siteData.section_visibility || {};
        const isVisible = currentVis[visKey] !== false;
        const newVis = { ...currentVis, [visKey]: !isVisible };
        const updatedSiteData = { ...siteData, section_visibility: newVis };
        setSiteData(updatedSiteData);

        authFetch('api.php?action=save_section', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ section_key: 'section_visibility', data: newVis })
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              showToast(!isVisible ? '👁️ แสดงส่วนนี้บนหน้าเว็บแล้ว' : '🙈 ซ่อนส่วนนี้จากหน้าเว็บแล้ว');
            }
          });
      };

      const saveSection = (sectionKey) => {
        authFetch('api.php?action=save_section', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ section_key: sectionKey, data: siteData[sectionKey] })
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              if (siteData.section_visibility) {
                authFetch('api.php?action=save_section', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ section_key: 'section_visibility', data: siteData.section_visibility })
                });
              }
              showToast(`บันทึกส่วน "${sectionKey}" เรียบร้อยแล้ว`);
            } else showToast('ข้อผิดพลาด: ' + res.error);
          })
          .catch(() => showToast('หมดเวลาเข้าสู่ระบบ หรือไม่สามารถบันทึกได้'));
      };

      const updateFooterListItem = (listKey, index, field, value) => {
        const list = [...(siteData.footer?.[listKey] || [])];
        list[index] = { ...list[index], [field]: value };
        setSiteData({ ...siteData, footer: { ...siteData.footer, [listKey]: list } });
      };

      const addFooterListItem = (listKey) => {
        const list = [...(siteData.footer?.[listKey] || []), { label: '', href: '#' }];
        setSiteData({ ...siteData, footer: { ...siteData.footer, [listKey]: list } });
      };

      const removeFooterListItem = (listKey, index) => {
        const list = (siteData.footer?.[listKey] || []).filter((_, itemIndex) => itemIndex !== index);
        setSiteData({ ...siteData, footer: { ...siteData.footer, [listKey]: list } });
      };

      const saveAll = () => {
        authFetch('api.php?action=save_all', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: siteData })
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) showToast('บันทึกข้อมูลเว็บไซต์ทั้งหมดเรียบร้อยแล้ว!');
            else showToast('ข้อผิดพลาด: ' + res.error);
          })
          .catch(() => showToast('หมดเวลาเข้าสู่ระบบ หรือไม่สามารถบันทึกได้'));
      };

      const handleFileUpload = (file, onSuccess) => {
        if (!file) return;
        setUploading(true);
        const formData = new FormData();
        formData.append('image', file);

        authFetch('api.php?action=upload_image', {
          method: 'POST',
          body: formData
        })
          .then(res => res.json())
          .then(res => {
            if (res.success) {
              showToast(`อัปโหลดสำเร็จ: ${res.filename}`);
              loadMedia();
              if (onSuccess) onSuccess(res.url);
            } else Swal.fire({ icon: 'error', title: 'อัปโหลดล้มเหลว', text: res.error });
          })
          .catch(() => Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'เกิดข้อผิดพลาดในการอัปโหลดไฟล์' }))
          .finally(() => setUploading(false));
      };

      const handleDeleteMedia = (filename) => {
        Swal.fire({
          icon: 'warning',
          title: 'ยืนยันการลบ',
          text: `คุณต้องการลบรูปภาพ "${filename}" ใช่หรือไม่?`,
          showCancelButton: true,
          confirmButtonText: 'ลบ',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#d33'
        }).then(result => {
          if (!result.isConfirmed) return;
          authFetch('api.php?action=delete_image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename })
          })
            .then(res => res.json())
            .then(res => {
              if (res.success) {
                showToast('ลบรูปภาพเรียบร้อยแล้ว');
                loadMedia();
              } else showToast('ข้อผิดพลาด: ' + res.error);
            });
        });
      };

      const updateOrderStatus = (orderNo, newStatus, currentTrackingNumber = '', currentCarrier = '') => {
        const applyStatus = (trackingNumber = '', shippingCarrier = '') => {
          authFetch('api.php?action=update_order_status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_no: orderNo, status: newStatus, tracking_number: trackingNumber, shipping_carrier: shippingCarrier })
          })
            .then(res => res.json())
            .then(res => {
              if (res.success) {
                Swal.fire({
                  icon: 'success',
                  title: 'สำเร็จ',
                  text: `อัปเดตสถานะออเดอร์ ${orderNo} แล้ว`,
                  timer: 2000,
                  showConfirmButton: false
                });
                loadOrders();
              } else {
                Swal.fire({ icon: 'error', title: 'ไม่สำเร็จ', text: res.error || 'อัปเดตสถานะไม่สำเร็จ' });
              }
            });
        };

        if (newStatus === 'shipping') {
          Swal.fire({
            title: 'ข้อมูลการจัดส่ง',
            html: `
              <input id="swal-shipping-carrier" class="swal2-input" placeholder="ชื่อขนส่ง (เช่น Kerry, Flash, J&T)" value="${String(currentCarrier || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" maxlength="100" style="display:flex;margin-bottom:10px">
              <input id="swal-tracking-number" class="swal2-input" placeholder="เลข Tracking" value="${String(currentTrackingNumber || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;')}" maxlength="100" style="display:flex">
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'บันทึก',
            cancelButtonText: 'ยกเลิก',
            preConfirm: () => {
              const shippingCarrier = document.getElementById('swal-shipping-carrier').value.trim();
              const trackingNumber = document.getElementById('swal-tracking-number').value.trim();
              if (!shippingCarrier) {
                Swal.showValidationMessage('กรุณากรอกชื่อขนส่ง');
                return false;
              }
              if (!trackingNumber) {
                Swal.showValidationMessage('กรุณากรอกเลข Tracking');
                return false;
              }
              return { shippingCarrier, trackingNumber };
            }
          }).then(result => {
            if (result.isConfirmed && result.value) {
              applyStatus(result.value.trackingNumber, result.value.shippingCarrier);
            }
          });
          return;
        }

        applyStatus();
      };

      const runInitDb = () => {
        Swal.fire({
          icon: 'question',
          title: 'ยืนยันการติดตั้ง',
          text: 'ต้องการรันติดตั้งตารางและข้อมูลเริ่มต้นลงใน MySQL ใช่หรือไม่?',
          showCancelButton: true,
          confirmButtonText: 'ติดตั้ง',
          cancelButtonText: 'ยกเลิก'
        }).then(result => {
          if (!result.isConfirmed) return;
          authFetch('api.php?action=init_db', { method: 'POST' })
            .then(res => res.json())
            .then(res => {
              if (res.success) {
                showToast(res.message);
                loadData();
              } else Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: res.error });
            })
            .catch(() => Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: 'หมดเวลาเข้าสู่ระบบ หรือไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้' }));
        });
      };

      if (!authState.checked) {
        return (
          <div className="d-flex align-items-center justify-content-center min-vh-100 text-muted fw-bold">
            <div className="spinner-border text-success me-3" role="status"></div>
            กำลังตรวจสอบสถานะสิทธิ์ผู้ดูแลระบบ...
          </div>
        );
      }

      // Login Gate Screen
      if (!authState.loggedIn) {
        return (
          <div className="login-wrapper">
            <form className="login-card" onSubmit={handleLoginSubmit}>
              <div className="login-brand-icon">
                <i className="bi bi-asterisk"></i>
              </div>
              <h1 className="login-title">fukupet Admin CMS</h1>
              <p className="login-subtitle">ระบบจัดการเนื้อหาหลังบ้าน fukupet Admin Edition</p>

              {loginError && (
                <div className="login-error-box">
                  <i className="bi bi-exclamation-triangle-fill me-2"></i>
                  {loginError}
                </div>
              )}

              <div className="form-group">
                <label className="form-label">ชื่อผู้ใช้งาน</label>
                <div className="input-group">
                  <span className="input-group-text bg-light border-end-0 text-muted"><i className="bi bi-person-fill"></i></span>
                  <input
                    type="text"
                    className="form-input border-start-0"
                    placeholder="Username"
                    required
                    autoFocus
                    value={loginForm.username}
                    onChange={e => setLoginForm({ ...loginForm, username: e.target.value })}
                  />
                </div>
              </div>

              <div className="form-group">
                <label className="form-label">รหัสผ่าน</label>
                <div className="input-group">
                  <span className="input-group-text bg-light border-end-0 text-muted"><i className="bi bi-lock-fill"></i></span>
                  <input
                    type="password"
                    className="form-input border-start-0"
                    placeholder="Password"
                    required
                    value={loginForm.password}
                    onChange={e => setLoginForm({ ...loginForm, password: e.target.value })}
                  />
                </div>
              </div>

              <button type="submit" className="btn-fukupet-lime login-btn" disabled={loginSubmitting}>
                {loginSubmitting ? (
                  <>
                    <span className="spinner-border spinner-border-sm me-2"></span>
                    กำลังตรวจสอบ...
                  </>
                ) : (
                  <>
                    <i className="bi bi-box-arrow-in-right"></i>
                    เข้าสู่ระบบ CMS
                  </>
                )}
              </button>
            </form>
          </div>
        );
      }

      if (loading || !siteData) {
        return (
          <div className="d-flex align-items-center justify-content-center min-vh-100 text-muted fw-bold">
            <div className="spinner-border text-success me-3" role="status"></div>
            กำลังโหลดข้อมูลระบบ CMS...
          </div>
        );
      }

      const totalSales = orders.reduce((sum, o) => sum + (parseFloat(o.total_price) || 0), 0);
      const visMap = siteData.section_visibility || {};

      // Render Toggle Switch Component for each Section Header
      const renderSectionHeader = (title, icon, sectionKey, visKey, saveKey) => {
        const isVisible = visMap[visKey] !== false;
        return (
          <div className="fukupet-card-header">
            <h3 className="fukupet-card-title">
              <i className={`bi ${icon}`}></i> {title}
            </h3>
            <div className="d-flex align-items-center gap-3 ms-auto">
              <div className="form-check form-switch m-0" title="คลิกเพื่อ แสดง/ซ่อน ส่วนนี้บนหน้าเว็บจริง">
                <input
                  className="form-check-input"
                  type="checkbox"
                  role="switch"
                  id={`vis-switch-${visKey}`}
                  checked={isVisible}
                  onChange={() => toggleSectionVisibility(visKey)}
                />
                <label className="form-check-label fw-bold small text-dark" htmlFor={`vis-switch-${visKey}`}>
                  {isVisible ? '👁️ แสดงบนหน้าเว็บ' : '🙈 ซ่อนจากหน้าเว็บ'}
                </label>
              </div>
              <button className="btn-fukupet-primary btn-sm" onClick={() => saveSection(saveKey)}>
                💾 บันทึกส่วนนี้
              </button>
            </div>
          </div>
        );
      };

                            }}
                          >
                            ลบคำถาม
                          </button>
                        </div>
                        <div className="form-group">
                          <label className="form-label">คำถาม</label>
                          <input
                            type="text"
                            className="form-input"
                            value={faq.question}
                            onChange={e => {
                              const newF = [...siteData.faq_section.faqs];
                              newF[idx].question = e.target.value;
                              setSiteData({ ...siteData, faq_section: { ...siteData.faq_section, faqs: newF } });
                            }}
                          />
                        </div>
                        <div className="form-group mb-0">
                          <label className="form-label">คำตอบ (รองรับ HTML)</label>
                          <textarea
                            className="form-textarea"
                            value={faq.answer}
                            onChange={e => {
                              const newF = [...siteData.faq_section.faqs];
                              newF[idx].answer = e.target.value;
                              setSiteData({ ...siteData, faq_section: { ...siteData.faq_section, faqs: newF } });
                            }}
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* SUBTAB 14b: FUKUPETSTORE CLUB */}
                {activeContentSubTab === 'club_section' && (
                  <div className="fukupet-card">
                    {renderSectionHeader('14.5 เข้าร่วม Fukupetstore Club', 'bi-envelope-heart-fill', 'club_section', 'club_section', 'footer')}
                    <div className="form-grid">
                      <div className="form-group">
                        <label className="form-label">หัวข้อ Fukupetstore Club</label>
                        <input
                          type="text"
                          className="form-input"
                          value={siteData.footer?.club_title || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, club_title: e.target.value } })}
                        />
                      </div>
                      <div className="form-group">
                        <label className="form-label">คำอธิบาย Fukupetstore Club</label>
                        <input
                          type="text"
                          className="form-input"
                          value={siteData.footer?.club_desc || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, club_desc: e.target.value } })}
                        />
                      </div>
                    </div>
                  </div>
                )}

                {/* SUBTAB 15: FOOTER */}
                {activeContentSubTab === 'footer' && (
                  <div className="fukupet-card">
                    {renderSectionHeader('15. ส่วนท้ายเว็บไซต์ & ข้อมูลติดต่อ (Footer)', 'bi-body-text', 'footer', 'footer', 'footer')}
                    <div className="form-grid mb-4">
                      {[
                        ['footer_about', 'ส่วนแนะนำเกี่ยวกับเรา'],
                        ['footer_products', 'คอลัมน์สินค้า'],
                        ['footer_services', 'คอลัมน์บริการและช่วยเหลือ'],
                        ['footer_contact', 'คอลัมน์ข้อมูลติดต่อ'],
                        ['footer_bottom', 'แถบลิขสิทธิ์และช่องทางชำระเงิน']
                      ].map(([visibilityKey, label]) => (
                        <div className="form-group" key={visibilityKey}>
                          <label className="form-label">{label}</label>
                          <select className="form-select" value={siteData.section_visibility?.[visibilityKey] !== false ? '1' : '0'} onChange={() => toggleSectionVisibility(visibilityKey)}>
                            <option value="1">แสดง</option>
                            <option value="0">ซ่อน</option>
                          </select>
                        </div>
                      ))}
                    </div>
                    <div className="form-grid">
                      <div className="form-group full-width">
                        <label className="form-label">คำอธิบายเกี่ยวกับเรา (About)</label>
                        <textarea
                          className="form-textarea"
                          value={siteData.footer?.about || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, about: e.target.value } })}
                        />
                      </div>
                      <div className="form-group">
                        <label className="form-label">หัวข้อ Fukupetstore Club</label>
                        <input
                          type="text"
                          className="form-input"
                          value={siteData.footer?.club_title || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, club_title: e.target.value } })}
                        />
                      </div>
                      <div className="form-group">
                        <label className="form-label">คำอธิบาย Fukupetstore Club</label>
                        <input
                          type="text"
                          className="form-input"
                          value={siteData.footer?.club_desc || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, club_desc: e.target.value } })}
                        />
                      </div>
                      <div className="form-group full-width">
                        <label className="form-label">ข้อความลิขสิทธิ์ (Copyright)</label>
                        <input
                          type="text"
                          className="form-input"
                          value={siteData.footer?.copyright || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, copyright: e.target.value } })}
                        />
                      </div>
                      <div className="form-group full-width">
                        <label className="form-label">ข้อความช่องทางการชำระเงิน</label>
                        <input
                          type="text"
                          className="form-input"
                          value={siteData.footer?.payments || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, payments: e.target.value } })}
                        />
                      </div>
                      <div className="form-group">
                        <label className="form-label">หัวข้อคอลัมน์สินค้า</label>
                        <input type="text" className="form-input" value={siteData.footer?.products_title || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, products_title: e.target.value } })} />
                      </div>
                      <div className="form-group">
                        <label className="form-label">หัวข้อคอลัมน์บริการ</label>
                        <input type="text" className="form-input" value={siteData.footer?.services_title || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, services_title: e.target.value } })} />
                      </div>
                      <div className="form-group">
                        <label className="form-label">หัวข้อคอลัมน์ติดต่อ</label>
                        <input type="text" className="form-input" value={siteData.footer?.contact_title || ''}
                          onChange={e => setSiteData({ ...siteData, footer: { ...siteData.footer, contact_title: e.target.value } })} />
                      </div>

                      {[
                        ['products', 'เมนูสินค้า'],
                        ['services', 'เมนูบริการและช่วยเหลือ'],
                        ['contact', 'ข้อมูลติดต่อ']
                      ].map(([listKey, title]) => (
                        <div className="form-group full-width" key={listKey}>
                          <label className="form-label">{title}</label>
                          {(siteData.footer?.[listKey] || []).map((item, index) => (
                            <div key={index} className="d-flex gap-2 mb-2 align-items-center">
                              <input
                                type="text"
                                className="form-input"
                                placeholder="ข้อความที่แสดง"
                                value={item.label || ''}
                                onChange={e => updateFooterListItem(listKey, index, 'label', e.target.value)}
                              />
                              <input
                                type="text"
                                className="form-input"
                                placeholder="ลิงก์ เช่น https://... หรือ #product"
                                value={item.href || ''}
                                onChange={e => updateFooterListItem(listKey, index, 'href', e.target.value)}
                              />
                              <button type="button" className="btn btn-sm btn-outline-danger" onClick={() => removeFooterListItem(listKey, index)}>ลบ</button>
                            </div>
                          ))}
                          <button type="button" className="btn-fukupet-outline btn-sm mt-1" onClick={() => addFooterListItem(listKey)}>
                            <i className="bi bi-plus-lg"></i> เพิ่มรายการ
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* TAB 4: MEDIA MANAGER */}
            {activeTab === 'media' && (
              <div className="fukupet-card">
                <div className="fukupet-card-header">
                  <h3 className="fukupet-card-title">
                    <i className="bi bi-images"></i> คลังรูปภาพในระบบ (/images/) - ทั้งหมด {mediaImages.length} ไฟล์
                  </h3>
                  <button className="btn-fukupet-outline btn-sm" onClick={loadMedia}>
                    <i className="bi bi-arrow-clockwise"></i> รีเฟรช
                  </button>
                </div>

                <div
                  className="upload-dropzone mb-4"
                  onClick={() => document.getElementById('media-dropzone-input').click()}
                >
                  <div className="fs-1 text-success mb-2"><i className="bi bi-cloud-arrow-up"></i></div>
                  <h5 className="fw-bold text-dark">คลิกที่นี่เพื่อเลือกไฟล์รูปภาพเพื่ออัปโหลด</h5>
                  <p className="text-muted small mb-0">
                    ไฟล์จะถูกอัปโหลดและบันทึกตรงเข้าโฟลเดอร์ <code>images/</code> โดยอัตโนมัติ (รองรับ JPG, PNG, WebP, GIF, SVG)
                  </p>
                  <input
                    type="file"
                    id="media-dropzone-input"
                    accept="image/*"
                    className="hidden-file-input"
                    onChange={e => handleFileUpload(e.target.files[0])}
                  />
                </div>

                {uploading && (
                  <div className="alert alert-info text-center fw-bold">
                    <span className="spinner-border spinner-border-sm me-2"></span>
                    กำลังอัปโหลดไฟล์รูปภาพ...
                  </div>
                )}

                <div className="media-grid">
                  {mediaImages.map((img, idx) => (
                    <div key={idx} className="media-card">
                      <img src={img.url} alt={img.filename} className="media-img" />
                      <div className="media-info">
                        <div className="media-name" title={img.filename}>{img.filename}</div>
                        <div className="text-muted small mb-2">{img.size_formatted}</div>
                        <div className="d-flex gap-1">
                          <button
                            className="btn btn-sm btn-outline-secondary py-1 px-2 flex-grow-1 small"
                            onClick={() => {
                              navigator.clipboard.writeText(img.url);
                              showToast('คัดลอก URL เรียบร้อย: ' + img.url);
                            }}
                          >
                            <i className="bi bi-copy"></i> คัดลอก
                          </button>
                          <button
                            className="btn btn-sm btn-outline-danger py-1 px-2 small"
                            onClick={() => handleDeleteMedia(img.filename)}
                          >
                            <i className="bi bi-trash"></i> ลบ
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 5: DATABASE SETUP */}
            {activeTab === 'database' && authState.is_superadmin && (
              <div className="fukupet-card">
                <div className="fukupet-card-header">
                  <h3 className="fukupet-card-title"><i className="bi bi-database-gear"></i> การเชื่อมต่อฐานข้อมูล SQL & การตั้งค่าระบบ</h3>
                </div>

                <div className="row g-3 mb-4">
                  <div className="col-md-3">
                    <div className="p-3 border rounded bg-light">
                      <span className="text-muted small d-block">Host</span>
                      <strong className="fs-6">localhost:3306</strong>
                    </div>
                  </div>
                  <div className="col-md-3">
                    <div className="p-3 border rounded bg-light">
                      <span className="text-muted small d-block">Database Name</span>
                      <strong className="fs-6">fukupet_dbwebsite</strong>
                    </div>
                  </div>
                  <div className="col-md-3">
                    <div className="p-3 border rounded bg-light">
                      <span className="text-muted small d-block">User Name</span>
                      <strong className="fs-6">fukupet_yok</strong>
                    </div>
                  </div>
                  <div className="col-md-3">
                    <div className="p-3 border rounded bg-light">
                      <span className="text-muted small d-block">สถานะการเชื่อมต่อ</span>
                      <strong className="fs-6" style={{ color: dbStatus?.connected ? 'var(--sys-green)' : 'var(--sys-orange)' }}>
                        {dbStatus?.connected ? '✓ เชื่อมต่อสำเร็จ' : '⚠️ โหมด Local JSON'}
                      </strong>
                    </div>
                  </div>
                </div>

                {dbStatus?.error && (
                  <div className="alert alert-warning mb-4 small fw-semibold">
                    <i className="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong>ข้อความแจ้งเตือนจาก MySQL:</strong> {dbStatus.error}
                  </div>
                )}

                <div className="p-4 border rounded-3 bg-light">
                  <h5 className="fw-bold text-dark mb-2">🚀 ติดตั้งและสร้างตารางฐานข้อมูล (Init Database)</h5>
                  <p className="text-muted small mb-3">
                    หากคุณได้สร้าง Database <code>fukupet_dbwebsite</code> ในแผงควบคุม Hosting เรียบร้อยแล้ว คุณสามารถคลิกปุ่มด้านล่างเพื่อสร้างตารางทั้งหมด พร้อมข้อมูลเริ่มต้น 100% ได้ทันที
                  </p>
                  <div className="d-flex gap-2 flex-wrap">
                    <button className="btn-fukupet-primary" onClick={runInitDb}>
                      <i className="bi bi-lightning-charge-fill"></i>
                      สั่งติดตั้งฐานข้อมูลอัตโนมัติ (Run Init DB)
                    </button>
                    <a href="initdatabase.sql" download="initdatabase.sql" className="btn-fukupet-outline">
                      <i className="bi bi-download"></i>
                      ดาวน์โหลด initdatabase.sql
                    </a>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'permissions' && authState.is_superadmin && (
              <div className="fukupet-card">
                <div className="fukupet-card-header">
                  <h3 className="fukupet-card-title"><i className="bi bi-person-lines-fill"></i> จัดการสิทธิ์ผู้ใช้งาน</h3>
                </div>
                
                <div className="row g-4 mb-4">
                  <div className="col-md-4">
                    <div className="p-4 border rounded-3 bg-light">
                      <h5 className="fw-bold text-dark mb-3">เพิ่มผู้ดูแลระบบ</h5>
                      <form onSubmit={handleCreateUser}>
                        <div className="mb-3">
                          <label className="form-label small fw-bold">ชื่อผู้ใช้งาน (Username)</label>
                          <input type="text" className="form-control" required value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} />
                        </div>
                        <div className="mb-3">
                          <label className="form-label small fw-bold">รหัสผ่าน (Password)</label>
                          <input type="password" className="form-control" required value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} />
                        </div>
                        <div className="mb-3">
                          <label className="form-label small fw-bold">ชื่อแสดงผล (Display Name)</label>
                          <input type="text" className="form-control" required value={newUser.display_name} onChange={e => setNewUser({...newUser, display_name: e.target.value})} />
                        </div>
                        <button type="submit" className="btn-fukupet-primary w-100">
                          <i className="bi bi-person-plus-fill me-2"></i> สร้างผู้ใช้งาน
                        </button>
                      </form>
                    </div>
                  </div>
                  
                  <div className="col-md-8">
                    <h5 className="fw-bold text-dark mb-3">รายชื่อผู้ดูแลระบบ (Admin Users)</h5>
                    <div className="table-responsive">
                      <table className="table table-bordered table-hover align-middle">
                        <thead className="table-light">
                          <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Display Name</th>
                            <th>Created At</th>
                            <th className="text-center">จัดการ</th>
                          </tr>
                        </thead>
                        <tbody>
                          {adminUsers.map(user => (
                            <tr key={user.id}>
                              <td>{user.id}</td>
                              <td>{user.username}</td>
                              <td>{user.display_name}</td>
                              <td>{user.created_at}</td>
                              <td className="text-center">
                                <button className="btn btn-sm btn-danger" onClick={() => handleDeleteUser(user.id)}>
                                  <i className="bi bi-trash"></i> ลบ
                                </button>
                              </td>
                            </tr>
                          ))}
                          {adminUsers.length === 0 && (
                            <tr>
                              <td colSpan="5" className="text-center py-3 text-muted">ไม่พบข้อมูลผู้ใช้งาน</td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>

          {/* Toast Notification */}
          {toast && (
            <div className="toast-fukupet">
              <i className="bi bi-check-circle-fill"></i>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('admin-root')).render(<AdminApp />);
  </script>
</body>
</html>
