		<script language="javascript">
			function newAccount4CT(){
				return windowOpen("b_Account4CTControl.aspx?mode=add&page=0", "new", 800, 380);
			}
			function listAccountCode(){
				var dF = document.forms[0];
				windowOpen("../../LOV/List/ListAccountCode.aspx?code=" + dF.txtAccCode.value + "&name=" + dF.txtAccName.value +"&ctrl1=txtAccCode&ctrl2=txtAccName&ctrl3=txtAccId&ctrl4=txthAccCode", "list", 650, 500);
				return false;	
			}
			function clearAccountCode(){
				var dF = document.forms[0];
				dF.txtAccCode.value ="";
				dF.txtAccName.value ="";
				dF.txtAccId.value="";
				dF.txthAccCode.value ="";
				return false;
			}
			function checkPercentRemind(obj1,obj2,obj3){
				var nObj1 = parseFloat(obj1.value.replace(/,/g, ""));
				var nObj2 = parseFloat(obj2.value.replace(/,/g, ""));
				var nObj3 = parseFloat(obj3.value.replace(/,/g, ""));
				var nPercent = nObj1+nObj2+nObj3;
				
				if(nPercent != 100){
					alertvb("ไม่สามารถบันทึกข้อมูลได้ เนื่องจากผลรวมของ % ไม่ครบ 100%", 48);
					
					return false;
				}
				return true;
			}
		</script>
