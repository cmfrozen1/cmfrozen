<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Management | CMFrozen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .dashboard-card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <!-- Top Navigation -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">MongoDB Dashboard</h1>
                <div id="apiStatus" class="mt-2 inline-flex items-center px-4 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-600 border border-amber-100">
                    <span class="w-2 h-2 mr-2 rounded-full bg-amber-500 animate-pulse"></span>
                    Connecting to MongoDB...
                </div>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl shadow-xl shadow-blue-100 transition-all transform active:scale-95 font-bold flex items-center gap-2">
                <i class="fas fa-plus"></i> Add New User
            </button>
        </div>

        <!-- Table Card -->
        <div class="dashboard-card overflow-hidden shadow-sm">
            <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">User Database</span>
                <span id="userCount" class="text-xs font-bold text-slate-500 bg-white px-3 py-1 rounded-full border border-slate-200">0 Total</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] border-b border-slate-50">
                            <th class="px-8 py-5">Full Name</th>
                            <th class="px-8 py-5">Email Address</th>
                            <th class="px-8 py-5 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userList" class="divide-y divide-slate-50">
                        <!-- Data injected by JS -->
                    </tbody>
                </table>
            </div>

            <!-- States -->
            <div id="loading" class="py-24 text-center">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
                <p class="mt-4 text-slate-500 font-bold">Fetching from MongoDB Atlas...</p>
            </div>

            <div id="emptyState" class="hidden py-24 text-center">
                <i class="fas fa-database text-5xl text-slate-200 mb-4"></i>
                <h3 class="text-xl font-bold text-slate-800">No data found</h3>
                <p class="text-slate-500 mt-1 font-medium">Add a user to see it in MongoDB.</p>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-10 transform transition-all">
            <h2 id="modalTitle" class="text-3xl font-black text-slate-800 mb-8">User Data</h2>
            <form id="userForm" class="space-y-6">
                <input type="hidden" id="userId">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Name</label>
                    <input type="text" id="userName" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-50 focus:border-blue-500 outline-none font-bold text-slate-800">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Email</label>
                    <input type="email" id="userEmail" required class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-50 focus:border-blue-500 outline-none font-bold text-slate-800">
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-all">Cancel</button>
                    <button type="submit" class="flex-[2] bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 shadow-lg">Save to MongoDB</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🔗 AUTOMATIC CONFIGURATION
        // ใช้ relative path เพื่อให้รองรับทั้ง Local และ Production โดยไม่ต้องแก้ URL
        const API_URL = '/api/users';
        
        let isEditing = false;

        async function fetchUsers() {
            console.log("Fetching from:", API_URL);
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                const data = await res.json();
                renderUsers(data);
                updateStatus('Connected to MongoDB', 'bg-emerald-100 text-emerald-700 border-emerald-200');
            } catch (err) {
                console.error(err);
                updateStatus('API Offline / 404', 'bg-rose-100 text-rose-700 border-rose-200');
                // แสดงข้อความ Error ที่ชัดเจนบนหน้าจอ
                document.getElementById('userList').innerHTML = `<tr><td colspan="3" class="py-10 text-center text-rose-500 font-bold">Error: Cannot reach the backend API. Please check Render Logs.</td></tr>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateStatus(text, classes) {
            const el = document.getElementById('apiStatus');
            el.className = `mt-2 inline-flex items-center px-4 py-1.5 rounded-full text-xs font-bold border ${classes}`;
            el.innerHTML = `<span class="w-2 h-2 mr-2 rounded-full ${classes.split(' ')[1].replace('text', 'bg').replace('700', '500')}"></span> ${text}`;
        }

        function renderUsers(users) {
            const list = document.getElementById('userList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = '';
            document.getElementById('userCount').innerText = users.length + ' Total';
            
            if (users.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            users.forEach(u => {
                list.innerHTML += `
                    <tr class="hover:bg-blue-50/30 transition-all group">
                        <td class="px-8 py-5 font-bold text-slate-800">${u.name}</td>
                        <td class="px-8 py-5 text-slate-500 font-medium">${u.email}</td>
                        <td class="px-8 py-5 text-right opacity-0 group-hover:opacity-100 transition-all">
                            <button onclick="editUser('${u._id}', '${u.name}', '${u.email}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg mr-2"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteUser('${u._id}')" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const data = { name: document.getElementById('userName').value, email: document.getElementById('userEmail').value };
            
            Swal.fire({ title: 'Saving...', didOpen: () => Swal.showLoading() });

            try {
                const method = isEditing ? 'PUT' : 'POST';
                const url = isEditing ? `${API_URL}/${id}` : API_URL;
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!res.ok) throw new Error('Save Failed');
                
                Swal.fire({ icon: 'success', title: 'Saved!', timer: 1000, showConfirmButton: false });
                closeModal();
                fetchUsers();
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        };

        async function deleteUser(id) {
            if (!(await Swal.fire({ title: 'Delete?', icon: 'warning', showCancelButton: true })).isConfirmed) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) fetchUsers();
            } catch (err) { alert(err.message); }
        }

        window.openModal = () => { isEditing = false; document.getElementById('userForm').reset(); document.getElementById('userId').value = ''; document.getElementById('modalTitle').innerText = 'New User'; document.getElementById('userModal').classList.remove('hidden'); };
        window.closeModal = () => document.getElementById('userModal').classList.add('hidden');
        window.editUser = (id, name, email) => { isEditing = true; document.getElementById('userId').value = id; document.getElementById('userName').value = name; document.getElementById('userEmail').value = email; document.getElementById('modalTitle').innerText = 'Edit User'; document.getElementById('userModal').classList.remove('hidden'); };

        fetchUsers();
    </script>
</body>
</html>
