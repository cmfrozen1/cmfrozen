<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Dashboard | CMFrozen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen p-6 md:p-10">
    
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">User Management</h1>
                <p id="apiStatus" class="mt-2 text-sm font-semibold text-amber-600 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Connecting to API...
                </p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl shadow-lg font-bold transition-all">
                <i class="fas fa-user-plus mr-2"></i> Add New User
            </button>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b">
                    <tr class="text-slate-500 text-xs font-bold uppercase tracking-wider">
                        <th class="px-8 py-5">Full Name</th>
                        <th class="px-8 py-5">Email Address</th>
                        <th class="px-8 py-5 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="userList" class="divide-y divide-slate-100"></tbody>
            </table>
            <div id="loading" class="py-20 text-center"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div></div>
            <div id="emptyState" class="hidden py-20 text-center text-slate-400 font-medium italic text-lg">No users found. Start by adding one!</div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="userModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8">
            <h2 id="modalTitle" class="text-2xl font-bold text-slate-800 mb-6">User Profile</h2>
            <form id="userForm" class="space-y-4">
                <input type="hidden" id="userId">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="userName" required placeholder="John Doe" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Email</label>
                    <input type="email" id="userEmail" required placeholder="john@example.com" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold">
                </div>
                <div class="flex gap-2 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 font-bold text-slate-500 hover:bg-slate-100 rounded-xl">Cancel</button>
                    <button type="submit" class="flex-[2] bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition-all">Save Data</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /**
         * ⚠️ CONFIGURATION (สำคัญ)
         * ---------------------------------------------------------
         * 1. เมื่อคุณได้ URL จาก Render แล้ว ให้เอามาใส่ในช่อง RENDER_URL ด้านล่างนี้
         * 2. ตัวอย่าง: const RENDER_URL = 'https://cmfrozen-api.onrender.com';
         */
        const RENDER_URL = ''; // <-- ใส่ URL จาก Render ที่นี่!
        
        // ถ้าเป็น Localhost ให้ใช้ /api/users, ถ้าอยู่บน Host ให้ใช้ RENDER_URL
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const BASE_URL = isLocal ? '' : RENDER_URL;
        const API_URL = `${BASE_URL}/api/users`;

        let isEditing = false;

        async function fetchUsers() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('API Error');
                const users = await res.json();
                renderUsers(users);
                updateStatus('API Online', 'text-emerald-600', 'bg-emerald-500');
            } catch (e) {
                console.error(e);
                updateStatus('API Offline (Check URL)', 'text-red-600', 'bg-red-500');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function updateStatus(text, textColor, dotColor) {
            const el = document.getElementById('apiStatus');
            el.className = `mt-2 text-sm font-semibold ${textColor} flex items-center gap-2`;
            el.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor}"></span> ${text}`;
        }

        function renderUsers(users) {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            if (users.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                users.forEach(u => {
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-all group">
                            <td class="px-8 py-5 font-bold text-slate-800">${u.name}</td>
                            <td class="px-8 py-5 text-slate-600 font-medium">${u.email}</td>
                            <td class="px-8 py-5 text-right">
                                <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                    <button onclick="editUser('${u._id}', '${u.name}', '${u.email}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg"><i class="fas fa-edit"></i></button>
                                    <button onclick="deleteUser('${u._id}')" class="p-2 text-red-600 hover:bg-red-50 rounded-lg"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>`;
                });
            }
        }

        document.getElementById('userForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            const data = { name: document.getElementById('userName').value, email: document.getElementById('userEmail').value };
            
            Swal.fire({ title: 'Processing...', didOpen: () => Swal.showLoading() });

            try {
                const method = isEditing ? 'PUT' : 'POST';
                const url = isEditing ? `${API_URL}/${id}` : API_URL;
                
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Saved!', timer: 1000, showConfirmButton: false });
                    closeModal();
                    fetchUsers();
                } else {
                    throw new Error('Save failed');
                }
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        };

        async function deleteUser(id) {
            const result = await Swal.fire({ title: 'Delete?', icon: 'warning', showCancelButton: true });
            if (result.isConfirmed) {
                try {
                    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    fetchUsers();
                } catch (e) { alert(e.message); }
            }
        }

        function openModal() {
            isEditing = false;
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('modalTitle').innerText = 'New User';
            document.getElementById('userModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('userModal').classList.add('hidden'); }

        function editUser(id, name, email) {
            isEditing = true;
            document.getElementById('userId').value = id;
            document.getElementById('userName').value = name;
            document.getElementById('userEmail').value = email;
            document.getElementById('modalTitle').innerText = 'Edit User';
            document.getElementById('userModal').classList.remove('hidden');
        }

        fetchUsers();
    </script>
</body>
</html>
