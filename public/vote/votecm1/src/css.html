/*  CSS ตัวเลขนับถอยหลัง */
      #timer {
				font-size: 1.5em;

			}

			#timer div {
				text-align: center;

			#timer div span {
				color:#eee;

			}    

/*  CSS radio button หน้ากาบัตรเลือกตั้ง */
    #msgAlert{
      color:red;
      text-align:center;
    }

    .radio-group-label {
      display: block;
      width: 100%;
      margin: 0px 0;
    }

    .radio-label {
      position: relative;
      display: inline-block;
      margin: 2px;
    }

    .radio-label input {
      opacity: 0;
      position: absolute;
    }

    .radio-label .inner-label1 {
      position: relative;
      display: inline-block;
      padding-left: 40px;
      transition: border-bottom;
    }

    .radio-label .inner-label {
      position: relative;
      display: inline-block;
      padding-left: 40px;
    }

    .radio-label .inner-label:before {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      border-bottom: 1px dashed rgba(50, 50, 50, 0.25);
      width: 30px;
      transition: border-bottom 0.5s ease;
    }

    .radio-label input:focus ~ .inner-label:before {
      border-bottom: 1px solid rgba(50, 50, 50, 0.75);
    }

    .radio-label input:checked ~ .inner-label:after {
      //content: "✓";
      content: "✘";
      color: #000;
      position: absolute;
      font-size: 1.8rem;
      left: 1px;
      top: -10px;
      padding-bottom:20px;
      height:40px;
    }

// CSS chartBar หน้าแสดงผลการเลือกตั้ง
    .chartBar{

/* ปรับตามขนาดหน้าจอ เมื่อเปิดบนมือถือ หรือ จอเล็กกว่าที่กำหนด */
