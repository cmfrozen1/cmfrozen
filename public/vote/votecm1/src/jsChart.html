<!-- Ref:https://www.chartjs.org/docs/latest/ -->

<script>
    $(document).ready(function () {
      getcases();
    });
      
    function getcases() {
      google.script.run.withSuccessHandler(function (ar) {
          console.log(ar);
          var data = [];
          var label = [];
            
          ar.forEach(function (item, index) {
            data.push(item[1]);
            label.push(item[0]);
          });
  
          var ctx = document.getElementById(
            "barchart").getContext("2d");
          
          // ตั้งค่าคุณสมบัติ Font
          Chart.defaults.font.size = 16;
          Chart.defaults.font.family = "K2D";

          var barchart = new Chart(ctx, {
            // กราฟวงกลม type: 'pie' กราฟเส้น type: 'line' กราฟโดนัท type:'doughnut'
            type: "bar", 
            title: {
              display: true,
              text: "ผลการเลือกตั้งคณะกรรมสวัสดิการ",
            },
            data: {
              labels: label,
              datasets: [{
                label: "คะแนนเสียง",
                data: data,
                backgroundColor: [
                  "rgba(255, 99, 132, 0.6)",
                  "rgba(54, 162, 235, 0.6)",
                  "rgba(4, 223, 77 , 0.6)",
                  "rgba(41, 128, 185, 0.6)",
                  "rgba(153, 102, 255, 0.6)",
                  "rgba(211, 84, 0 , 0.6)",
                  "rgba(79, 4, 158, 0.6)",
                  "rgba(54, 162, 235, 0.6)",
                  "rgba(255, 206, 86, 0.6)",
                  "rgba(136, 3, 53 , 0.6)",
                  "rgba(6, 21, 250, 0.6)",
                  "rgba(255, 59, 64, 0.6)",
                ],
                borderColor: [
                  "rgba(255, 99, 132, 1)",
                  "rgba(54, 162, 235, 1)",
                  "rgba(4, 223, 77 , 1)",
                  "rgba(41, 128, 185, 1)",
                  "rgba(153, 102, 255, 1)",
                  "rgba(211, 84, 0 , 1)",
                  "rgba(79, 4, 158, 1)",
                  "rgba(54, 162, 235, 1)",
                  "rgba(255, 206, 86, 1)",
                  "rgba(136, 3, 53 , 1)",
                  "rgba(6, 21, 250, 1)",
                  "rgba(255, 59, 64, 1)",
                ],
                borderWidth: 1,
              },
            ],
            },
  
            options: {
              legend: { display: true },
              title: {
                display: true,
                text: "คะแนนเสียง",
              },
            },
          });
          })
          .getCases();
        }
    </script>
