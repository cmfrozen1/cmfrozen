<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบสต๊อกร้านชายของชา</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>

  <!-- Google Identity Services (GIS) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // ตั้งค่า Client ID ตรงกับ wrangler.toml
    window.GOOGLE_CLIENT_ID = '326468727847-v2fpjo7880ugd32lnq6p1rsc3e4dfv6l.apps.googleusercontent.com';

    let gsiReady = false;

    /* รับ id_token หลัง login สำเร็จ (One Tap หรือ Button) */
    window.handleCredentialResponse = async function (response) {
      try {
        showLoading(true);
        const idToken = response && response.credential;
        if (!idToken) throw new Error('ไม่ได้รับ credential จาก Google');
        const data = await StoreAPI.loginWithToken(idToken);
        // เก็บ role/email ไว้แสดงใน app.html
        try {
          if (data && data.email) localStorage.setItem('store_user_email', data.email);
          if (data && data.role) localStorage.setItem('store_user_role', data.role);
          if (data && data.name) localStorage.setItem('store_user_name', data.name);
        } catch(e) {}
        // สำเร็จ -> ไปหน้าหลัก
        window.location.href = 'app.html';
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบด้วย Google ไม่สำเร็จ', text: err.message || 'token ไม่ถูกต้องหรือหมดอายุ', confirmButtonColor: '#15803D' });
      } finally {
        showLoading(false);
      }
    };

    function initGsi() {
      // รอ GIS โหลด
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
        setTimeout(initGsi, 200);
        return;
      }
      try {
        google.accounts.id.initialize({
          client_id: window.GOOGLE_CLIENT_ID,
          callback: window.handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: false,
          context: 'signin',
          ux_mode: 'popup'
        });
        const btnWrap = document.getElementById('gsiBtnWrap');
        const btnEl = document.getElementById('gsiBtn');
        if (btnEl) {
          google.accounts.id.renderButton(btnEl, {
            type: 'standard',
            theme: 'outline',
            size: 'large',
            text: 'signin_with',
            shape: 'rectangular',
            logo_alignment: 'left',
            width: 320
          });
          if (btnWrap) btnWrap.style.display = 'block';
        }
        // ซ่อนปุ่ม fallback ถ้า render สำเร็จ
        const fallback = document.getElementById('googleFallbackBtn');
        if (fallback) fallback.style.display = 'none';

        // พยายามแสดง One Tap (ถ้า browser อนุญาต)
        try { google.accounts.id.prompt(); } catch(e) {}

        gsiReady = true;
        const hint = document.getElementById('gsiHint');
        if (hint) hint.style.display = 'none';
      } catch (e) {
        console.error('GSI init fail', e);
        const hint = document.getElementById('gsiHint');
        if (hint) hint.textContent = 'Google Login โหลดไม่สำเร็จ กรุณารีเฟรช';
      }
    }

    /* ปุ่ม fallback: ถ้า GSI ไม่พร้อมให้ลอง prompt อีกครั้ง */
    window.googleLoginFallback = function () {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
        Swal.fire({ icon: 'error', title: 'Google Login ยังไม่พร้อม', text: 'กรุณารอ Google โหลด หรือรีเฟรชหน้า', confirmButtonColor: '#15803D' });
        return;
      }
      if (!gsiReady) initGsi();
      try { google.accounts.id.prompt(); } catch(e) {
        Swal.fire({ icon: 'info', title: 'กรุณาใช้ปุ่ม Google ด้านบน', text: 'หากปุ่มไม่แสดง ให้ปิด AdBlock หรือลองใช้ Chrome', confirmButtonColor: '#15803D' });
      }
    };

    window.addEventListener('load', function () { setTimeout(initGsi, 300); });
    // ลอง init ทันที เผื่อ GIS โหลดไว
    setTimeout(initGsi, 800);
  </script>
  <style>
    /* Google button wrapper */
    #gsiBtnWrap { display:none; margin-bottom:12px; }
    #gsiBtn { display:flex; justify-content:center; min-height:44px; }
    #gsiBtn > div { width:100% !important; }
    #gsiBtn iframe { width:100% !important; }
    .btn-google-fallback {
      width:100%;
      padding:13px 14px;
      background:#fff;
      border:1.5px solid #dadce0;
      border-radius:14px;
      font-weight:600;
      font-size:15px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      cursor:pointer;
      transition:.18s;
      color:#3c4043;
      box-shadow:0 1px 2px rgba(0,0,0,.06);
    }
    .btn-google-fallback:hover { background:#f8f9fa; box-shadow:0 2px 8px rgba(0,0,0,.08); transform:translateY(-1px); }
    .login-divider {
      display:flex; align-items:center; gap:12px; margin:18px 0 16px; color:var(--muted); font-size:13px;
    }
    .login-divider::before, .login-divider::after { content:""; flex:1; height:1px; background:var(--border); }
    .login-divider span { background:rgba(255,255,255,.9); padding:0 8px; border-radius:99px; }
    #gsiHint { font-size:12px; color:var(--muted); margin-top:6px; }
  </style>
</head>
<body>
  <div class="login-screen">
    <div class="login-box">
      <div style="font-size:48px;color:var(--primary);margin-bottom:10px"><i class="fa-solid fa-leaf"></i></div>
      <h1>ระบบสต๊อกสินค้า</h1>
      <p class="sub">ร้านชายของชา</p>

      <!-- Google login (GIS renderButton จะมาแทนที่ปุ่มนี้) -->
      <div id="gsiBtnWrap">
        <div id="gsiBtn"></div>
        <div id="gsiHint">กำลังโหลด Google...</div>
      </div>

      <!-- Fallback ปุ่ม Google แบบ custom (จะซ่อนเมื่อ GSI พร้อม) -->
      <button type="button" class="btn-google-fallback" id="googleFallbackBtn" onclick="googleLoginFallback()">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        เข้าสู่ระบบด้วย Google
      </button>

      <div class="login-divider"><span>หรือ</span></div>

      <!-- Password login (fallback สำหรับ admin) -->
      <form id="loginForm">
        <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password" autofocus>
        <div class="login-error" id="loginError"></div>
        <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบด้วยรหัสผ่าน</button>
      </form>
      <div style="margin-top:14px;font-size:13px;color:var(--muted)">รหัสผ่านเริ่มต้น: 1234 &middot; Google Login สำหรับทุกคน</div>
    </div>
  </div>

  <footer class="site-footer">พัฒนาโดย <strong>ครบเครื่องเรื่องไอที</strong> (สำหรับทดสอบระบบ)</footer>

  <script>
    if (Token.get()) { window.location.href = 'app.html'; }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.textContent = '';
      const pw = document.getElementById('password').value;
      if (!pw) { errEl.textContent = 'กรุณากรอกรหัสผ่าน'; return; }
      try {
        showLoading(true);
        const data = await StoreAPI.login(pw);
        try {
          localStorage.setItem('store_user_role', data.role || 'admin');
          localStorage.setItem('store_user_email', 'admin (password)');
        } catch(e) {}
        window.location.href = 'app.html';
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: err.message, confirmButtonColor: '#15803D' });
      } finally {
        showLoading(false);
      }
    });
  </script>

  <div class="loading-overlay hidden" id="loadingOverlay" aria-hidden="true">
    <div class="loader-box">
      <div class="bx-lid"></div>
      <div class="bx-body"><i class="fa-solid fa-box-open"></i></div>
      <div class="loader-text">กำลังเข้าสู่ระบบ...</div>
    </div>
  </div>

  <script>
    (function animateFavicon() {
      var icons = ['favicon-box.svg', 'favicon-open.svg'];
      var idx = 0;
      setInterval(function () {
        idx = (idx + 1) % icons.length;
        var link = document.querySelector('link[rel="icon"]');
        if (link) link.href = icons[idx];
      }, 450);
    })();
  </script>
</body>
</html>
